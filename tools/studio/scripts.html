<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boktai 3 Scripts</title>
<link rel="stylesheet" href="/static/common.css">
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #2b2620; --muted: #7d7468; --line: #e3dccf;
  --accent: #b5462f; --accent-ink: #fff; --sel: #f3e3d6; --ok: #2f7d4f; --kw: #5a5fa8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dc; --muted: #9a9083; --line: #3a352e;
    --accent: #e0745a; --accent-ink: #1b1916; --sel: #3a2c25; --ok: #6cc596; --kw: #a8acef;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
button, input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 53px); }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side .tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.count, .chk { color: var(--muted); font-size: 12px; }
.chks { display: flex; flex-wrap: wrap; gap: 2px 10px; }
#list { overflow-y: auto; flex: 1; }
.row { padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--sel); }
.row.on { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.row b { font-weight: 500; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.row .lab { margin-left: 6px; }
.row small { display: block; color: var(--muted); font-size: 11px; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
#view { overflow: auto; padding: 14px 20px 40px; min-width: 0; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.meta { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); white-space: nowrap; }
.chip a { text-decoration: none; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow: auto; font: 12px/1.55 ui-monospace, Menlo, monospace; margin: 0; }
pre a { text-decoration: none; }
pre .kw { color: var(--kw); }
pre .cmt { color: var(--muted); }
table { border-collapse: collapse; font-size: 13px; }
td, th { padding: 3px 12px 3px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
body.embed #side { display: none; }
body.embed main { grid-template-columns: 1fr; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #side { height: 40vh; } }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="side">
    <div class="tools">
      <input id="q" type="search" placeholder="Filter: proc number, label, actor key" autocomplete="off">
      <div class="chks">
        <label class="chk"><input type="checkbox" id="fscene"> scene entries</label>
        <label class="chk"><input type="checkbox" id="fspawn"> create actors</label>
        <label class="chk"><input type="checkbox" id="ftext"> show strings</label>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div id="list"></div>
    <button id="more" class="more" hidden>Show more</button>
  </section>
  <section id="view"><div class="empty">Loading…</div></section>
</main>
<script src="/static/common.js"></script>
<script>
// Script procedures from the compiled script image (tools/assets/gcx.py,
// cross-referenced by tools/assets/actors.py). Procedures carry the numbers
// calls use, one above the headers gcx.py prints.
studioHeader();
let P = [], byId = {}, scenes = {}, actorsBy = {}, keyOfName = {}, callees = {}, procNames = {}, procOfName = {}, sel = null, shown = 300, lastD = null;
let readable = true;
try { readable = localStorage.getItem('scripts.readable') !== '0'; } catch (e) {}

const label = p => noteOf('script', p.id)?.label;
function renderList() {
  const q = $('q').value.trim().toUpperCase(), fs = $('fscene').checked, fa = $('fspawn').checked, ft = $('ftext').checked;
  const hits = P.filter(p => (!fs || p.scene) && (!fa || p.spawns) && (!ft || p.texts || p.prints) &&
    (!q || String(p.id) === q || [label(p), procNames[p.id], ...p.keys, ...p.keys.map(k => noteOf('actor', k)?.label)].some(x => (x || '').toUpperCase().includes(q)) || String(p.id).startsWith(q)));
  const at = hits.findIndex(p => p.id === sel);
  if (at >= shown) shown = at + 50;
  $('count').textContent = `${hits.length} of ${P.length} procedures`;
  $('list').replaceChildren(...hits.slice(0, shown).map(p => {
    const d = document.createElement('div'); d.className = 'row' + (p.id === sel ? ' on' : ''); d.dataset.id = p.id;
    const sc = scenes[p.id];
    d.innerHTML = `<b>proc ${p.id}${procNames[p.id] ? ' ' + esc(procNames[p.id]) : ''}</b>${p.scene ? '<span class="tag">scene</span>' : ''}<span class="lab"></span><small>${[
      `${p.n} lines`, p.callers ? `${p.callers} callers` : 'no callers', p.scenes && !p.scene ? `${p.scenes} scenes` : '',
      p.spawns ? `${p.spawns} actors` : '', p.texts + p.prints ? `${p.texts + p.prints} strings` : '', p.scene && sc?.map ? 'map ' + sc.map : ''].filter(Boolean).join(' · ')}</small>`;
    d.querySelector('.lab').textContent = label(p) || '';
    d.onclick = () => { location.hash = p.id; };
    return d;
  }));
  $('more').hidden = hits.length <= shown;
}
$('more').onclick = () => { shown += 600; renderList(); };

const sceneChip = s => {
  const sc = scenes[s] || {};
  return `<span class="chip"><a href="#${s}">scene ${s}</a>${sc.map ? ' · ' + peekLink(gfxHref('map', sc.map), esc(noteOf('map', sc.map)?.label || sc.map)) : ''}${sc.shot ? ' · ' + peekLink('/captures#scene_' + String(s).padStart(4, '0'), 'capture') : ''}</span>`;
};
const gclName = k => { const g = actorsBy[k]?.gcl?.[0]; return g && g.name + (g.english ? ` (${g.english})` : ''); };
const actorName = k => noteOf('actor', k)?.label || gclName(k) || (actorsBy[k]?.names.length ? actorsBy[k].names.map(n => n.jp).join(' / ') + '?' : actorsBy[k]?.callback_name) || '';
// one disassembled line, with procedures, strings and actors linked
function linkLine(ln) {
  return esc(ln)
    .replace(/\/\* .*? \*\/|  # .*$/g, m => `<span class="cmt">${m}</span>`)
    .replace(/\b(if|else|switch|case|return|load|chara|command|mesg|print|trap|map|eval|call)\b/g, '<span class="kw">$1</span>')
    .replace(/\bproc_(\d+)/g, (m, n) => byId[n] ? `<a href="#${n}">${m}</a>` : m)
    .replace(/text#(\d+)/g, (m, n) => stringLink(n, m))
    .replace(/(<span class="kw">load<\/span> )(0x[0-9a-f]+|\d+)/g, (m, a, n) => `${a}<a href="#${parseInt(n)}">${n}</a>`)
    .replace(/(<span class="kw">(?:chara|command)<\/span> |<span class="kw">trap<\/span> \S+ )(0x[0-9a-f]+|[^\s<]+)/g, (m, a, k) => {
      const key = k.startsWith('0x') ? parseInt(k, 16).toString(16).toUpperCase().padStart(4, '0') : keyOfName[k];
      return key ? `${a}<span title="${esc(actorName(key))}">${actorLink(key, k)}</span>` : m;
    });
}

// one line of the readable view (tools/assets/gclview.py)
function linkReadable(ln) {
  const code = ln.split('  # ')[0], note = ln.slice(code.length);
  const c = esc(code)
    .replace(/^(\s*)(#.*)$/, '$1<span class="cmt">$2</span>')
    .replace(/\b(if|elif|else|match|case|return|spawn|and|or|not|pass)\b(?![^<]*<\/span>)/g, '<span class="kw">$1</span>')
    .replace(/\bproc_(\d+)\(/g, (m, n) => byId[n] ? `<a href="#${n}">proc_${n}</a>(` : m)
    .replace(/\b([A-Za-z_]\w*)\(/g, (m, n) => procOfName[n] ? `<a href="#${procOfName[n]}" title="proc ${procOfName[n]}">${n}</a>(`
      : callees[n] ? `<span title="${esc(actorName(callees[n]))}">${actorLink(callees[n], n)}</span>(` : m)
    .replace(/\btext\((\d+)\)/g, (m, n) => 'text(' + stringLink(n, n) + ')');
  return c + (note ? `<span class="cmt">${esc(note)}</span>` : '');
}

function renderBody(d) {
  const box = $('body'); if (!box) return;
  box.innerHTML = readable && d.readable?.length ? d.readable.map(linkReadable).join('\n') : d.lines.map(linkLine).join('\n');
}

async function show(id) {
  sel = id;
  if (P.length) renderList();
  document.querySelectorAll('.row').forEach(d => d.classList.toggle('on', +d.dataset.id === id));
  document.querySelector('.row.on')?.scrollIntoView({ block: 'nearest' });
  const v = $('view');
  const d = await fetch('/api/proc/' + id).then(r => r.ok ? r.json() : null);
  if (!d) { v.innerHTML = `<div class="empty">No procedure ${id}.</div>`; return; }
  const sc = scenes[id];
  const spawns = {};
  for (const s of d.spawns) (spawns[s.key] ||= { ...s, n: 0, args: [] }).n++, s.arg && spawns[s.key].args.push(s.arg);
  lastD = d;
  v.innerHTML = `<h2>Procedure ${id}${procNames[id] ? ' · <code>' + esc(procNames[id]) + '</code>' : ''}${d.scene ? ' · scene entry' : ''}</h2>
    <div class="meta">flag ${d.flag} · ${d.lines.length} lines · printed as <code>proc ${id - 1}</code> by <code>gcx.py dis</code>${d.scene && sc?.map ? ` · loads map ${peekLink(gfxHref('map', sc.map), esc(noteOf('map', sc.map)?.label || sc.map))}` : ''}${d.scene && sc?.shot ? ' · ' + peekLink('/captures#scene_' + String(id).padStart(4, '0'), 'stage survey capture') : ''}</div>
    <div id="ned"></div>
    <h3>Called by (${d.callers.length})</h3>${d.callers.length ? `<div class="chips">${d.callers.map(c => `<span class="chip"><a href="#${c}">proc ${c}</a></span>`).join('')}</div>`
      : `<div class="empty">No script calls it${d.scene ? ' (a scene: entered with load)' : d.flag ? ' (the engine or stage data starts it)' : ''}.</div>`}
    <h3>Calls (${d.calls.length})</h3>${d.calls.length ? `<div class="chips">${d.calls.map(c => `<span class="chip"><a href="#${c}">proc ${c}</a></span>`).join('')}</div>` : '<div class="empty">None.</div>'}
    ${d.loads.length ? `<h3>Loads scenes</h3><div class="chips">${[...new Set(d.loads)].map(sceneChip).join('')}</div>` : ''}
    <h3>Used by scenes (${d.scenes.length})</h3>${d.scenes.length ? `<div class="chips" id="scenes">${d.scenes.slice(0, 80).map(s => sceneChip(s.scene)).join('')}${d.scenes.length > 80 ? `<span class="chip">+${d.scenes.length - 80} more</span>` : ''}</div>` : '<div class="empty">No scene reaches it through calls.</div>'}
    ${d.spawns.length ? `<h3>Creates actors</h3><table><tr><th>Key</th><th>Actor</th><th>Callback</th><th>Command</th></tr>${Object.values(spawns).map(s => `<tr><td>${actorLink(s.key)}</td><td>${esc(actorName(s.key))}</td><td>${s.callback ? codeLink(s.callback, s.name) : '?'}</td><td class="meta">${s.cmd}${s.n > 1 ? ' ×' + s.n : ''}${s.args.length ? ' (' + esc([...new Set(s.args)].slice(0, 6).join(', ')) + ')' : ''}</td></tr>`).join('')}</table>` : ''}
    ${d.texts.length ? `<h3>Strings</h3><table>${d.texts.map(t => t.data ? `<tr><td>#${t.id}</td><td class="meta">a data record in the text bank, not text</td></tr>` : `<tr><td>${stringLink(t.id)}</td><td>${esc(t.jp)}</td></tr>`).join('')}</table>` : ''}
    ${d.prints.length ? `<h3>Debug prints</h3><div class="meta" style="margin-bottom:6px">Developer messages; <code>print</code> outputs nothing in this ROM (0821B858). English from gcl/prints.csv.</div><table>${d.prints.map(t => `<tr><td>${esc(t.text)}</td><td class="meta">${esc(t.en)}</td></tr>`).join('')}</table>` : ''}
    <h3>Body <label class="chk" style="text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px"><input type="checkbox" id="readable"${readable ? ' checked' : ''}> readable</label></h3>
    <div class="meta" style="margin-bottom:6px">${readable ? 'Readable view (tools/assets/gclview.py): English names, named arguments; debug prints as # log comments. Untick for GCL as compiled (gcx.py).' : 'GCL as compiled, Konami-style (tools/assets/gcx.py).'}</div>
    <pre id="body"></pre>`;
  renderBody(d);
  $('readable').onchange = e => { readable = e.target.checked; try { localStorage.setItem('scripts.readable', readable ? '1' : '0'); } catch (x) {} show(id); };
  $('ned').replaceWith(noteEditor('script', id, renderList));
}

$('q').oninput = () => { shown = 300; renderList(); };
['fscene', 'fspawn', 'ftext'].forEach(i => $(i).onchange = () => { shown = 300; renderList(); });
listKeys(() => $('list'), '.row');
window.onhashchange = () => { const n = parseInt(location.hash.slice(1)); if (n && n !== sel) show(n); };
(async () => {
  await loadNotes();
  const [d, a] = await Promise.all([fetch('/api/procs').then(r => r.json()), fetch('/api/actors').then(r => r.json())]);
  P = d.procs; scenes = d.scenes; byId = Object.fromEntries(P.map(p => [p.id, p]));
  callees = d.callees || {}; procOfName = d.procnames || {};
  procNames = Object.fromEntries(Object.entries(procOfName).map(([n, i]) => [i, n]));
  actorsBy = Object.fromEntries(a.actors.map(x => [x.key, x]));
  keyOfName = Object.fromEntries(a.actors.filter(x => x.gcl.length).map(x => [x.gcl[0].name, x.key]));
  renderList();
  const n = parseInt(location.hash.slice(1)) || P.find(p => p.scene)?.id;
  if (n) { if (!location.hash) history.replaceState(null, '', '#' + n); show(n); }
})();
</script>
</body>
</html>
