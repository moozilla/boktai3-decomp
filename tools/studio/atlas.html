<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boktai 3 Browse</title>
<link rel="stylesheet" href="/static/common.css">
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #2b2620; --muted: #7d7468; --line: #e3dccf;
  --accent: #b5462f; --accent-ink: #fff; --sel: #f3e3d6; --ok: #2f7d4f; --warn: #a8741a; --soft: #efe9de;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dc; --muted: #9a9083; --line: #3a352e;
    --accent: #e0745a; --accent-ink: #1b1916; --sel: #3a2c25; --ok: #6cc596; --warn: #d8a54a; --soft: #2b2723;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#side .tools { padding: 10px; border-bottom: 1px solid var(--line); }
#side .tools input { width: 100%; }
#tree { overflow-y: auto; flex: 1; padding: 6px 0 30px; font-size: 13.5px; }
.tn { display: flex; align-items: center; gap: 4px; padding: 2px 10px 2px calc(8px + var(--d) * 14px); cursor: pointer; white-space: nowrap; user-select: none; }
.tn:hover { background: var(--sel); }
.tn.on { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.tn .tw { width: 12px; color: var(--muted); font-size: 10px; flex: none; text-align: center; }
.tn .tl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tn .tc { color: var(--muted); font-size: 11px; }
.tn.folder > .tl { font-weight: 550; }
.tn.d0 > .tl { text-transform: uppercase; letter-spacing: .05em; font-size: 12px; color: var(--muted); font-weight: 650; }
.tn.d0 { margin-top: 6px; }
.tn .ti { width: 12px; flex: none; color: var(--muted); font-size: 10px; text-align: center; }
#view { overflow: auto; min-width: 0; }
.page { padding: 18px 28px 60px; max-width: 1180px; }
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }
h1.t { font-size: 24px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.sub { color: var(--muted); margin-top: 2px; }
.sub .jp { color: var(--ink); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
.badge.ok { border-color: var(--ok); color: var(--ok); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 10px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
h3 .n { font-weight: 500; letter-spacing: 0; text-transform: none; }
.lede { font-size: 15px; margin: 12px 0 0; max-width: 760px; }
.empty { color: var(--muted); }
.mono, code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); white-space: nowrap; color: var(--ink); }
a.chip:hover { border-color: var(--accent); text-decoration: none; }
.chip small { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-height: 64px; }
.card:hover { border-color: var(--accent); text-decoration: none; }
.card .pic { min-height: 72px; display: flex; align-items: center; justify-content: center; image-rendering: pixelated; }
.card .ct { font-weight: 550; line-height: 1.25; }
.card small { color: var(--muted); font-size: 11.5px; }
.card.folder { background: var(--soft); }
.pic[data-h] { display: inline-flex; min-width: 16px; min-height: 16px; align-items: center; justify-content: center; }
.pals { display: flex; flex-wrap: wrap; gap: 8px; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 84px; max-width: 140px; color: var(--ink); text-align: center; }
.pal:hover { border-color: var(--accent); text-decoration: none; }
.pal.def { border-color: var(--ink); }
.pal .pic { min-height: 64px; display: flex; align-items: center; justify-content: center; image-rendering: pixelated; }
.pal small { color: var(--muted); font-size: 11px; line-height: 1.2; }
.spritebox { margin-bottom: 14px; }
.spritebox .sh { font-size: 13px; margin-bottom: 6px; }
.spritebox .sh .mono { color: var(--muted); }
.places .pl { margin-bottom: 10px; }
.places .pl > a { font-weight: 550; }
.places .pl .chips { margin-top: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; width: 160px; display: inline-block; vertical-align: middle; }
.bar > i { display: block; height: 100%; background: var(--ok); }
table.t { border-collapse: collapse; font-size: 13px; width: 100%; }
table.t td, table.t th { padding: 4px 12px 4px 0; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
.ok { color: var(--ok); }
.muted { color: var(--muted); }
#search { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 60; }
#search.on { display: flex; }
#search .box { width: min(640px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,.25); overflow: hidden; }
#search input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 14px; font-size: 16px; outline: none; }
#sres { max-height: 56vh; overflow-y: auto; }
#sres .r { display: flex; gap: 10px; align-items: baseline; padding: 7px 14px; cursor: pointer; }
#sres .r.on { background: var(--sel); }
#sres .r .k { font-size: 11px; color: var(--muted); width: 64px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
#sres .r .p { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.mapframe { width: 100%; height: 460px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
pre.script { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; max-height: 70vh; font: 12.5px/1.5 ui-monospace, Menlo, monospace; white-space: pre; }
.kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #side { height: 40vh; } .page { padding: 14px 16px 40px; } }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="side">
    <div class="tools"><input id="q" type="search" placeholder="Filter the tree" autocomplete="off"></div>
    <div id="tree"></div>
  </section>
  <section id="view"><div class="page empty">Loading the game index…</div></section>
</main>
<div id="search"><div class="box"><input id="sq" placeholder="Search everything: a monster, place, item, sprite, script, function…" autocomplete="off"><div id="sres"></div></div></div>
<script src="/static/common.js"></script>
<script>
// Browse: every kind of thing in the game as one tree (tools/studio/atlas.py),
// each with a page of everything known about it. Links to the other Studio
// views open in the side panel.
studioHeader(`<button id="sbtn" title="Search everything">Search <span class="kbd">⌘K</span></button>`);
let T = [], E = {}, F = null, open = new Set(), SEL = null;
const nodes = {};                  // folder path -> node
const ICON = { package: '▤', actor: '◆', monster: '☠', char: '☺', item: '◇', area: '▣', scene: '▫', file: '≡', sprite: '▤', unit: '{}' };
const KIND = { package: 'sprite', actor: 'object', monster: 'monster', char: 'character', item: 'item', area: 'area', scene: 'scene', file: 'script', sprite: 'sprite', unit: 'code' };
const href = id => '#' + id;
const link = (id, text) => E[id] ? `<a href="${href(id)}">${esc(text ?? E[id].title)}</a>` : esc(text ?? id);
const chip = (id, text, extra = '') => E[id] ? `<a class="chip" href="${href(id)}">${esc(text ?? E[id].title)}${extra}</a>` : '';
const label = e => e.short && e.kind === 'area' ? e.short : e.title;

// ---------- reverse indices ----------
const sceneActors = {}, areaOf = {};
function indexAll() {
  for (const e of Object.values(E)) {
    if (e.kind === 'actor' && e.placed) for (const [a, ss] of Object.entries(e.areas || {})) for (const s of ss) (sceneActors['scene:' + s] ||= []).push(e.id);
    if (e.kind === 'area') for (const s of e.scenes) areaOf[s] = e.id;
  }
}

// ---------- tree ----------
function walk(n, path, d, f) { f(n, path, d); for (const c of n.children) walk(c, path + '/' + c.title, d + 1, f); }
function renderTree() {
  const q = $('q').value.trim().toLowerCase();
  const out = [];
  const hit = id => { const e = E[id]; return !q || [e.title, e.key, e.jp, e.fname].some(x => (x || '').toLowerCase().includes(q)); };
  const any = n => n.items.some(hit) || n.children.some(any);
  const emit = (n, path, d) => {
    if (q && !any(n)) return;
    const isOpen = q ? true : open.has(path);
    out.push(`<div class="tn folder d${d}${SEL === 'node:' + path ? ' on' : ''}" style="--d:${d}" data-node="${esc(path)}"><span class="tw">${isOpen ? '▾' : '▸'}</span><span class="tl">${esc(n.title)}</span><span class="tc">${n.count}</span></div>`);
    if (!isOpen) return;
    for (const c of n.children) emit(c, path + '/' + c.title, d + 1);
    const items = n.items.filter(hit);
    for (const id of items.slice(0, q ? 200 : 2000)) {
      const e = E[id];
      out.push(`<div class="tn${SEL === id ? ' on' : ''}" style="--d:${d + 1}" data-id="${esc(id)}"><span class="ti">${ICON[e.kind] || '·'}</span><span class="tl">${esc(label(e))}</span></div>`);
    }
  };
  for (const n of T) emit(n, n.title, 0);
  $('tree').innerHTML = out.join('');
  document.querySelector('#tree .tn.on')?.scrollIntoView({ block: 'nearest' });
}
$('tree').onclick = e => {
  const t = e.target.closest('.tn'); if (!t) return;
  if (t.dataset.node) {
    const p = t.dataset.node;
    // the chevron, or a click on the open group already shown, toggles it
    if (e.target.classList.contains('tw') || (SEL === 'node:' + p && open.has(p))) { open.has(p) ? open.delete(p) : open.add(p); renderTree(); return; }
    open.add(p); location.hash = 'node:' + p;
  } else location.hash = t.dataset.id;
};
$('q').oninput = renderTree;
// arrow keys walk the tree (outside text fields): up/down move, right opens a
// group, left closes it
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || $('search').classList.contains('on')) return;
  if (!['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key) || e.metaKey || e.altKey) return;
  const rows = [...document.querySelectorAll('#tree .tn')], i = rows.findIndex(r => r.classList.contains('on'));
  const cur = rows[i];
  e.preventDefault();
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    if (cur?.dataset.node) { const p = cur.dataset.node; e.key === 'ArrowRight' ? open.add(p) : open.delete(p); renderTree(); }
    return;
  }
  const next = rows[e.key === 'ArrowDown' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1)];
  if (next) location.hash = next.dataset.node ? 'node:' + next.dataset.node : next.dataset.id;
});
function reveal(path) {
  const parts = path.split('/');
  for (let i = 1; i <= parts.length; i++) open.add(parts.slice(0, i).join('/'));
}

// ---------- thumbnails (drawn when they scroll into view) ----------
const seen = new IntersectionObserver(es => {
  for (const x of es) if (x.isIntersecting) { seen.unobserve(x.target); draw(x.target); }
}, { root: null, rootMargin: '200px' });
function thumb(kind, hash, size, opt = {}) {
  return `<span class="pic" data-k="${kind}" data-h="${hash}" data-s="${size}" data-o='${JSON.stringify(opt)}'></span>`;
}
function draw(el) {
  spriteThumb(el.dataset.k, el.dataset.h, +el.dataset.s, JSON.parse(el.dataset.o || '{}'))
    .then(cv => { if (cv) { cv.style.imageRendering = 'pixelated'; el.replaceChildren(cv); } }).catch(() => {});
}
function hydrate(root) { root.querySelectorAll('.pic[data-h]').forEach(el => seen.observe(el)); }

// ---------- pages ----------
function crumbs(path) {
  if (!path) return '';
  const parts = path.split('/');
  return `<div class="crumbs">${parts.map((p, i) => `<a href="#node:${esc(parts.slice(0, i + 1).join('/'))}">${esc(p)}</a>`).join(' › ')}</div>`;
}
function head(e, sub = '', badges = []) {
  return `${crumbs(e.path || (E[e.area]?.path ? E[e.area].path + '/' + E[e.area].short : ''))}<h1 class="t">${esc(e.title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}`;
}
const badge = (t, cls = '') => `<span class="badge ${cls}">${t}</span>`;
// A picture for an entity: its own sprite, its family's, its icon.
function picOf(e, size = 64) {
  if (!e) return '';
  if (e.kind === 'sprite') return thumb('big', e.key, size);
  if (e.kind === 'package') return thumb('spr', e.key, size);
  if (e.kind === 'monster') { if (e.palette) return thumb('big', e.palette.sprite, size, { pool: e.palette.pool }); const a = E[e.actors[0]]; return a ? picOf(a, size) : ''; }
  if (e.kind === 'char') { const sp = e.sprites?.[0]; if (sp) return sp.startsWith('spr:') ? thumb('spr', sp.slice(4), size) : thumb('big', sp.slice(7), size); return e.actors?.length ? picOf(E[e.actors[0]], size) : ''; }
  if (e.kind === 'actor' && e.pic) return e.pic.startsWith('spr:') ? thumb('spr', e.pic.slice(4), size) : thumb('big', e.pic.slice(7), size);
  if (e.kind === 'actor') { if (e.sprites[0]) return thumb('big', e.sprites[0], size); if (e.small[0]) return thumb('spr', e.small[0], size); return ''; }
  if (e.kind === 'item') { const [h, f] = (e.icon || '').split('/'); return h ? thumb('spr', h, Math.min(48, size), { frame: +f }) : ''; }
  return '';
}
const nodePic = {};
function folderPic(path) {
  if (path in nodePic) return nodePic[path];
  const n = nodes[path]; let pic = '';
  for (const id of n?.items || []) { pic = picOf(E[id], 48); if (pic) break; }
  if (!pic) for (const c of n?.children || []) { pic = folderPic(path + '/' + c.title); if (pic) break; }
  return nodePic[path] = pic;
}
const folderCard = path => { const n = nodes[path]; return `<a class="card folder" href="#node:${esc(path)}">${folderPic(path) ? `<span class="picw">${folderPic(path)}</span>` : ''}<span class="ct">${esc(n.title)}</span><small>${n.count}</small></a>`; };
function cardFor(id) {
  const e = E[id]; if (!e) return '';
  let pic = picOf(e), small = KIND[e.kind] || e.kind;
  if (e.kind === 'actor') small = e.nscenes ? `${e.nscenes} scene${e.nscenes > 1 ? 's' : ''}` : (e.procs.length ? 'scripted' : 'unused');
  if (e.kind === 'monster') small = `No. ${e.order}` + (e.jp ? ` · ${e.jp}` : '');
  if (e.kind === 'sprite') small = e.key + (e.variants.length ? ` · ${e.variants.length + 1} palettes` : '');
  if (e.kind === 'package') small = 'package ' + e.key;
  if (e.kind === 'item') small = e.jp;
  if (e.kind === 'area') small = `${e.scenes.length} scene${e.scenes.length > 1 ? 's' : ''}`;
  if (e.kind === 'scene') small = E[e.area]?.title || '';
  if (e.kind === 'file') small = `${e.nprocs} procedures`;
  if (e.kind === 'unit') small = `${e.funcs.length} functions · ${e.size ? Math.round(100 * e.matched / e.size) : 0}% matched`;
  if (e.kind === 'char') small = e.jp;
  return `<a class="card" href="${href(id)}">${pic ? `<span class="picw">${pic}</span>` : ''}<span class="ct">${esc(label(e))}</span><small>${esc(small)}</small></a>`;
}
function nodePage(path) {
  const n = nodes[path]; if (!n) return `<div class="page empty">No such group.</div>`;
  const kids = n.children.map(c => folderCard(path + '/' + c.title)).join('');
  const items = n.items.map(cardFor).join('');
  return `<div class="page">${crumbs(path.split('/').slice(0, -1).join('/'))}<h1 class="t">${esc(n.title)} <span class="muted" style="font-size:15px;font-weight:400">${n.count}</span></h1>
    ${kids ? `<h3>Groups</h3><div class="cards">${kids}</div>` : ''}${items ? `<h3>${n.children.length ? 'Here' : 'Contents'} <span class="n">${n.items.length}</span></h3><div class="cards">${items}</div>` : ''}</div>`;
}

function palettes(hash) {
  const s = E['sprite:' + hash];
  if (!s) return `<div class="spritebox"><div class="sh"><span class="mono">${hash}</span></div>${thumb('big', hash, 64)}</div>`;
  const one = (pool, lab, isDef, src) => `<a class="pal${isDef ? ' def' : ''}" href="/gfx#pool/${pool}/${hash}" data-peek>${thumb('big', hash, 64, { pool })}<small><b>${pool}</b>${isDef ? ' · default' : ''}</small>${lab ? `<small>${esc(lab)}</small>` : ''}${src && src !== 'run' ? `<small class="muted">${esc(src)}</small>` : ''}</a>`;
  return `<div class="spritebox"><div class="sh"><a href="#sprite:${hash}">${esc(s.title)}</a> <span class="mono">${hash}</span> · ${peekLink(gfxHref('big', hash), 'frames ↗')}</div>
    <div class="pals">${one(s.default, s.default_label, true)}${s.variants.map(v => one(v.pool, v.label, false, v.source)).join('')}</div></div>`;
}
function placesOf(areas, from) {
  const rows = Object.entries(areas || {}).sort((a, b) => (E['area:' + a[0]]?.order ?? 999) - (E['area:' + b[0]]?.order ?? 999));
  if (!rows.length) return '<div class="empty">Not placed in any scene found so far.</div>';
  const byLoc = {};
  for (const [a, ss] of rows) { const ar = E['area:' + a]; (byLoc[ar?.location || 'Elsewhere'] ||= []).push([a, ss]); }
  return `<div class="places">${Object.entries(byLoc).map(([loc, list]) => `<div class="pl"><b>${esc(loc)}</b>${list.map(([a, ss]) => `<div style="margin:4px 0 0 0">${link('area:' + a, E['area:' + a]?.short)} <span class="chips" style="display:inline-flex">${ss.map(s => from ? `<a class="chip" href="#scene:${s}@${from}">${esc(E['scene:' + s]?.title.startsWith('Scene ') ? String(s) : E['scene:' + s]?.title)}</a>` : chip('scene:' + s, E['scene:' + s]?.title.startsWith('Scene ') ? String(s) : E['scene:' + s]?.title)).join('')}</span></div>`).join('')}</div>`).join('')}</div>`;
}
async function funcs() { return F ??= fetch('/api/atlas/funcs').then(r => r.json()); }
function codeTable(names, el) {
  funcs().then(fi => {
    const rows = names.map(n => fi[n]).filter(Boolean);
    const size = rows.reduce((s, f) => s + f.size, 0), done = rows.reduce((s, f) => s + (f.matched ? f.size : 0), 0);
    const pct = size ? Math.round(100 * done / size) : 0;
    el.innerHTML = rows.length ? `<div style="margin-bottom:8px"><span class="bar"><i style="width:${pct}%"></i></span> <b>${pct}%</b> <span class="muted">decompiled · ${rows.filter(f => f.matched).length} of ${rows.length} functions · ${size.toLocaleString()} bytes</span></div>
      <table class="t"><tr><th>Function</th><th>Address</th><th>Bytes</th><th>Source</th><th></th></tr>${rows.map(f => `<tr><td>${codeLink(f.addr, f.name)}</td><td class="mono muted">${f.addr}</td><td>${f.size}</td><td class="muted">${esc(f.unit.startsWith('functions/') ? '' : f.unit.replace(/^game\//, ''))}</td><td>${f.matched ? '<span class="ok">✓ C</span>' : '<span class="muted">asm</span>'}</td></tr>`).join('')}</table>` : '<div class="empty">No functions traced.</div>';
  });
}

// Where an object is: scenes whose own script creates it; otherwise the
// shared scripts that do (run by many scenes, or by the system).
function placement(e) {
  if (e.nscenes) return placesOf(e.areas, e.id);
  const sh = (e.shared || []).map(f => E['file:' + f]).filter(Boolean);
  if (!e.procs.length) return '<div class="empty">No script creates it.</div>';
  return `<div class="muted" style="margin-bottom:6px">Not placed by a scene. Created by ${sh.length > 1 ? 'these shared scripts' : 'a shared script'}:</div><div class="chips">${sh.map(f => chip(f.id, f.title, f.description ? ` <small>${esc(f.description)}</small>` : '')).join('')}</div>`;
}
const PAGES = {
  actor(e) {
    const species = e.names.filter(n => E['monster:' + n.id]);
    const chars = (e.chars || []).filter(id => E[id]);
    const sub = [e.names.length ? `<span class="jp">${e.names.map(n => esc(n.jp)).join(' · ')}</span>` : '', e.gcl[0] ? `GCL <b>${esc(e.gcl[0].name)}</b>` : '', `key <span class="mono">${e.key}</span>`].filter(Boolean).join(' · ');
    const b = [`<a class="badge" href="#unit:${esc(e.subsystem)}">code: ${esc(e.subsystem)}</a>`, badge(e.creates ? 'object' : 'script routine'), e.nscenes ? badge(`placed in ${e.nscenes} scenes`) : '', e.procs.length ? badge(`${e.spawns} script calls`) : badge('not created by scripts')];
    return `<div class="page">${head(e, sub, b)}
      ${chars.length ? `<h3>Character</h3><div class="chips">${chars.map(id => chip(id)).join('')}</div>` : ''}
      ${species.length ? `<h3>Species <span class="n">${species.length}</span></h3><div class="chips">${species.map(n => chip('monster:' + n.id, n.en || n.jp, ` <small>${esc(n.jp)}</small>`)).join('')}</div>` : ''}
      <h3>Sprites and palettes <span class="n">${e.sprites.length}</span></h3>${e.sprites.length ? e.sprites.map(palettes).join('') : `<div class="empty">Its own code (${esc(e.fname)}${e.loader_name ? ', ' + esc(e.loader_name) : ''}) loads no large sprite we can trace${e.small.length ? '' : '; it may draw with a sprite package or a background layer'}.</div>`}
      ${e.effects?.length ? `<details style="margin-top:6px"><summary class="muted">Other sprites its code loads <span class="n">${e.effects.length}</span>: effects, projectiles and things it spawns</summary><div class="cards" style="margin-top:8px">${e.effects.map(h => cardFor('sprite:' + h)).join('')}</div></details>` : ''}
      ${e.small.length ? `<div class="cards" style="margin-top:8px">${e.small.map(h => cardFor('spr:' + h)).join('')}</div>` : ''}
      <div class="grid2"><div><h3>Placed in <span class="n">${e.nscenes} scenes</span></h3>${placement(e)}</div>
      <div><h3>Created by <span class="n">${e.procs.length} procedures</span></h3>${e.procs.length ? `<div class="chips">${e.procs.map(p => `<a class="chip" href="/scripts#${p.id}" data-peek>${esc(p.name || 'proc ' + p.id)}</a>`).join('')}</div>` : '<div class="empty">No script creates it.</div>'}</div></div>
      <h3>Code</h3><div class="muted" style="margin-bottom:8px">Entry ${codeLink(e.callback, e.fname)}${e.loader ? ` → ${codeLink(e.loader, e.loader_name)}` : ''}, and everything it calls or installs.</div><div id="code"></div>
      <h3>Notes</h3><div id="ned"></div></div>`;
  },
  monster(e) {
    const fam = e.actors.map(id => E[id]).filter(Boolean);
    const others = fam.flatMap(a => a.names).filter(n => n.id !== +e.key && E['monster:' + n.id]);
    const prev = E['monster:' + (+e.key - 1)], next = E['monster:' + (+e.key + 1)];
    const hero = e.palette ? `<div style="display:flex;gap:16px;align-items:center;margin-top:14px"><div style="image-rendering:pixelated">${thumb('big', e.palette.sprite, 128, { pool: e.palette.pool })}</div><div class="muted">Drawn in palette ${peekLink('/gfx#pool/' + e.palette.pool, e.palette.pool)} of ${link('sprite:' + e.palette.sprite)}<br><small>${esc(e.palette.label)}</small></div></div>` : '';
    return `<div class="page">${head(e, `<span class="jp">${esc(e.jp)}</span> · No. ${e.order} in the game's monster list · ${stringLink(e.key, 'string ' + e.key)}`)}${hero}
      <div class="badges">${prev ? `<a class="badge" href="#${prev.id}">‹ ${esc(prev.title)}</a>` : ''}${next ? `<a class="badge" href="#${next.id}">${esc(next.title)} ›</a>` : ''}</div>
      ${fam.length ? fam.map(a => `<h3>Family</h3><div>${link(a.id)} <span class="muted">· ${esc(a.path)}</span></div>
        ${others.length ? `<h3>Related species</h3><div class="chips">${others.map(n => chip('monster:' + n.id, n.en || n.jp)).join('')}</div>` : ''}
        <h3>Sprites and palettes</h3>${a.sprites.map(palettes).join('') || '<div class="empty">Its own code loads no large sprite we can trace; it may draw with a sprite package or a background layer.</div>'}
        <h3>Placed in <span class="n">${a.nscenes} scenes</span></h3>${placement(a)}`).join('') : '<h3>Family</h3><div class="empty">Not linked to an object in the code yet.</div>'}</div>`;
  },
  char(e) {
    const big = (e.sprites || []).filter(x => x.startsWith('sprite:')).map(x => x.slice(7));
    const pk = (e.sprites || []).filter(x => x.startsWith('spr:'));
    return `<div class="page">${head(e, `<span class="jp">${esc(e.jp)}</span> · ${stringLink(e.key, 'string ' + e.key)}`)}
      ${pk.length || big.length ? `<h3>Sprites</h3>${pk.length ? `<div class="cards">${pk.map(cardFor).join('')}</div>` : ''}${big.map(palettes).join('')}` : ''}
      <h3>Objects</h3>${e.actors.length ? `<div class="cards">${e.actors.map(cardFor).join('')}</div>` : '<div class="empty">Not linked to an object yet.</div>'}</div>`;
  },
  package(e) {
    return `<div class="page"><div style="display:flex;gap:18px;align-items:center"><div style="image-rendering:pixelated">${thumb('spr', e.key, 128)}</div><div>${head(e, `sprite package <span class="mono">${e.key}</span> · ${peekLink(gfxHref('spr', e.key), 'frames ↗')}`)}</div></div>
      ${(e.chars || []).length ? `<h3>Character</h3><div class="chips">${e.chars.map(id => chip(id)).join('')}</div>` : ''}
      <h3>Used by</h3>${e.owners.length ? `<div class="cards">${e.owners.map(cardFor).join('')}</div>` : '<div class="empty">No owner traced yet.</div>'}</div>`;
  },
  area(e) {
    const here = (e.actors || []).map(id => E[id]).filter(a => a && a.placed);
    const byTop = {};
    for (const a of here) (byTop[a.path.split('/')[0]] ||= []).push(a.id);
    const items = e.scenes.flatMap(s => (E[s]?.items || []).map(x => [s, x]));
    return `<div class="page">${head(e, `${esc(e.location)} · ${e.scenes.length} scenes · ${peekLink('/world#area=' + e.key, 'world map ↗')}`)}
      <h3>Scenes <span class="n">${e.scenes.length}</span></h3><table class="t"><tr><th>Scene</th><th>Floor</th><th>Objects</th><th>Items</th></tr>${e.scenes.map(s => `<tr><td>${link(s)}</td><td class="muted">${esc(E[s]?.floor || '')}</td><td>${(sceneActors[s] || []).length || ''}</td><td>${(E[s]?.items || []).length || ''}</td></tr>`).join('')}</table>
      ${Object.entries(byTop).map(([t, ids]) => `<h3>${esc(t)} <span class="n">${ids.length}</span></h3><div class="cards">${ids.map(cardFor).join('')}</div>`).join('')}
      ${items.length ? `<h3>Items <span class="n">${items.length}</span></h3><div class="chips">${items.map(([s, x]) => `<span class="chip">${esc(x.name || 'item')}${x.chest ? ' <small>chest</small>' : ''} <small>· ${s.split(':')[1]}</small></span>`).join('')}</div>` : ''}</div>`;
  },
  scene(e, from) {
    const ar = E[e.area], acts = sceneActors[e.id] || [], fa = E[from];
    const hl = fa?.procs?.length ? '/hl=' + fa.procs.map(p => p.id).join('.') : '';
    const doors = [...new Map(e.doors.filter(d => d.scene).map(d => [d.scene, d])).values()];
    const groups = {};
    for (const id of acts) (groups[E[id].path.split('/')[0]] ||= []).push(id);
    const stageKey = e.stage ? `${e.stage.map}-${e.stage.tileset}-${e.stage.hp}` : null;
    return `<div class="page">${head(e, `${link(e.area)}${e.floor && e.floor !== 'N/A' ? ' · ' + esc(e.floor) : ''} · scene ${e.key} · ${peekLink(`/world#area=${ar?.key}/scene=${e.key}`, 'world ↗')}`)}
      ${stageKey ? `<h3>Map${fa ? ` <span class="n">showing where ${link(fa.id)} is placed</span>` : ''}</h3><iframe class="mapframe" src="/gfx?embed=1&bare=1#maps/${stageKey}/${e.key}${hl}" loading="lazy"></iframe>` : ''}
      ${Object.entries(groups).map(([t, ids]) => `<h3>${esc(t)} <span class="n">${ids.length}</span></h3><div class="cards">${ids.map(cardFor).join('')}</div>`).join('') || '<h3>Objects</h3><div class="empty">No object placed by this scene\'s script.</div>'}
      <h3>Doors to <span class="n">${doors.length}</span></h3>${doors.length ? `<div class="chips">${doors.map(d => chip('scene:' + d.scene, E['scene:' + d.scene]?.title, d.cond?.length ? ' <small>conditional</small>' : '')).join('')}</div>` : '<div class="empty">No doors found in the stage data.</div>'}
      ${e.items.length ? `<h3>Items <span class="n">${e.items.length}</span></h3><div class="chips">${e.items.map(x => { const it = Object.values(E).find(i => i.kind === 'item' && i.jp === x.name); return it ? chip(it.id, null, x.chest ? ' <small>chest</small>' : '') : `<span class="chip">${esc(x.name || '?')}</span>`; }).join('')}</div>` : ''}
      ${e.file ? `<h3>Script <label class="muted" style="text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" id="sen" checked> English text</label> <span class="n">${peekLink('/scripts#file=' + E[e.file].key, 'open in Scripts ↗')}</span></h3><pre class="script" id="script" data-file="${esc(E[e.file].key)}">Loading…</pre>` : ''}</div>`;
  },
  item(e) {
    const [h, f] = (e.icon || '').split('/');
    const where = {};
    for (const s of e.found) { const a = E[s]?.area; (where[a] ||= []).push(s.split(':')[1]); }
    return `<div class="page"><div style="display:flex;gap:18px;align-items:center">${h ? `<div style="image-rendering:pixelated">${thumb('spr', h, 64, { frame: +f })}</div>` : ''}<div>${head(e, `<span class="jp">${esc(e.jp)}</span> · ${stringLink(e.string, 'name string ' + e.string)}${h ? ' · ' + peekLink(gfxHref('spr', h, f), 'icon ↗') : ''}`)}</div></div>
      <h3>Found in <span class="n">${e.found.length} placements</span></h3>${e.found.length ? placesOf(Object.fromEntries(Object.entries(where).map(([a, ss]) => [a.split(':')[1], ss]))) : '<div class="empty">Not placed in a scene\'s stage data (bought, given or carried).</div>'}</div>`;
  },
  file(e) {
    return `<div class="page">${head(e, `${esc(e.description || '')} · ${e.nprocs} procedures`)}
      <p class="lede">${peekLink('/scripts#file=' + e.key, 'Read the script ↗')}</p>
      ${e.entry != null && E['scene:' + e.entry] ? `<h3>Scene</h3><div>${link('scene:' + e.entry)}</div>` : ''}
      <h3>Procedures</h3><div class="chips">${e.procs.slice(0, 300).map(p => `<a class="chip" href="/scripts#${p}" data-peek>${p}</a>`).join('')}</div></div>`;
  },
  sprite(e) {
    const one = (pool, lab, isDef, src) => `<a class="pal${isDef ? ' def' : ''}" href="/gfx#pool/${pool}/${e.key}" data-peek>${thumb('big', e.key, 128, { pool })}<small><b>${pool}</b>${isDef ? ' · default' : ''}</small>${lab ? `<small>${esc(lab)}</small>` : ''}${src ? `<small class="muted">${esc(src)}</small>` : ''}</a>`;
    return `<div class="page">${head(e, `large sprite <span class="mono">${e.key}</span> · ${peekLink(gfxHref('big', e.key), 'frames ↗')}${e.frames ? ' · ' + esc(e.frames) : ''}`)}
      <h3>Palettes <span class="n">${e.variants.length + 1}</span></h3><div class="pals">${one(e.default, e.default_label, true)}${e.variants.map(v => one(v.pool, v.label, false, v.source)).join('')}</div>
      <h3>Used by</h3>${e.owners.length ? `<div class="cards">${e.owners.map(cardFor).join('')}</div>` : '<div class="empty">No owner traced yet.</div>'}</div>`;
  },
  unit(e) {
    return `<div class="page">${head(e, `${e.funcs.length} functions · ${e.size.toLocaleString()} bytes${e.tentative ? ' · tentative grouping' : ''}`)}
      ${e.objects?.length ? `<h3>Registry entries <span class="n">${e.objects.length}</span></h3><div class="cards">${e.objects.map(cardFor).join('')}</div>` : ''}<h3>Functions</h3><div id="code"></div></div>`;
  },
};

function route() {
  const [id, from] = decodeURIComponent(location.hash.slice(1)).split('@');
  SEL = id || null;
  $('peek')?.classList.remove('on');  // a new page: the panel's peek belonged to the old one
  let html;
  if (!id) html = home();
  else if (id.startsWith('node:')) { reveal(id.slice(5)); html = nodePage(id.slice(5)); }
  else if (E[id]) { if (E[id].path) reveal(E[id].path); html = (PAGES[E[id].kind] || (() => `<div class="page">${head(E[id])}</div>`))(E[id], from); }
  else html = `<div class="page empty">Nothing called ${esc(id)}.</div>`;
  const v = $('view'); v.innerHTML = html; v.scrollTop = 0;
  hydrate(v);
  const e = E[id];
  if (e && (e.kind === 'actor' || e.kind === 'unit') && $('code')) codeTable(e.kind === 'actor' ? e.code : e.funcs, $('code'));
  if (e?.kind === 'actor' && $('ned')) $('ned').replaceWith(noteEditor('actor', e.key));
  if ($('script')) {
    const load = () => fetch(`/api/file/${$('script').dataset.file}/inline${$('sen').checked ? '/en' : ''}`).then(r => r.json())
      .then(d => { $('script').textContent = (d.lines || []).map(x => x[1]).join('\n'); });
    $('sen').onchange = load; load();
  }
  document.title = 'Boktai 3 ' + (e ? e.title : id.startsWith('node:') ? id.split('/').pop() : 'Browse');
  renderTree();
}
function home() {
  return `<div class="page"><h1 class="t">Boktai 3</h1><div class="cards" style="margin-top:16px">${T.map(n => folderCard(n.title)).join('')}</div></div>`;
}

// ---------- search (⌘K) ----------
let SR = [], SI = 0;
function searchOpen() { $('search').classList.add('on'); $('sq').value = ''; doSearch(); $('sq').focus(); }
function searchClose() { $('search').classList.remove('on'); }
function doSearch() {
  const q = $('sq').value.trim().toLowerCase();
  const score = e => {
    const t = (e.title || '').toLowerCase();
    if (!q) return 0;
    if (t === q || (e.key || '').toLowerCase() === q) return 100;
    if (t.startsWith(q)) return 80;
    if (t.includes(q)) return 60;
    if ([e.jp, e.fname, e.key, ...(e.names || []).map(n => n.jp + ' ' + n.en)].some(x => (x || '').toLowerCase().includes(q))) return 40;
    return 0;
  };
  const rank = { monster: 9, actor: 8, char: 8, item: 7, area: 6, scene: 5, sprite: 4, file: 3, unit: 2 };
  SR = q ? Object.values(E).map(e => [score(e), e]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0] || rank[b[1].kind] - rank[a[1].kind] || a[1].title.localeCompare(b[1].title)).slice(0, 60).map(x => x[1]) : [];
  SI = 0; drawSearch();
}
function drawSearch() {
  $('sres').innerHTML = SR.map((e, i) => `<div class="r${i === SI ? ' on' : ''}" data-i="${i}"><span class="k">${KIND[e.kind] || e.kind}</span><span>${esc(e.title)}${e.jp ? ` <span class="muted">${esc(e.jp)}</span>` : ''}</span><span class="p">${esc(e.path || E[e.area]?.title || '')}</span></div>`).join('') || `<div class="r muted">${$('sq').value ? 'No matches.' : 'Type to search monsters, places, items, sprites, scripts and code.'}</div>`;
  document.querySelector('#sres .r.on')?.scrollIntoView({ block: 'nearest' });
}
$('sq').oninput = doSearch;
$('sq').onkeydown = e => {
  if (e.key === 'ArrowDown') { SI = Math.min(SR.length - 1, SI + 1); drawSearch(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { SI = Math.max(0, SI - 1); drawSearch(); e.preventDefault(); }
  else if (e.key === 'Enter' && SR[SI]) { location.hash = SR[SI].id; searchClose(); }
  else if (e.key === 'Escape') searchClose();
};
$('sres').onclick = e => { const r = e.target.closest('.r[data-i]'); if (r) { location.hash = SR[+r.dataset.i].id; searchClose(); } };
$('search').onclick = e => { if (e.target.id === 'search') searchClose(); };
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchOpen(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); searchOpen(); }
});
$('sbtn') && ($('sbtn').onclick = searchOpen);

(async () => {
  const [ix] = await Promise.all([fetch('/api/atlas').then(r => r.json()), loadNotes()]);
  T = ix.tree; E = ix.entities;
  for (const n of T) walk(n, n.title, 0, (x, p) => { nodes[p] = x; });
  indexAll();
  window.onhashchange = route;
  route();
})();
</script>
</body>
