<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boktai 3 Code</title>
<link rel="stylesheet" href="/static/common.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }
input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
body.embed main { grid-template-columns: 1fr; }
body.embed #side { display: none; }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#side .tools { padding: 10px; border-bottom: 1px solid var(--line); }
#side .tools input { width: 100%; }
#tree { overflow-y: auto; flex: 1; padding: 6px 0 30px; font-size: 13.5px; }
.tn { display: flex; align-items: center; gap: 5px; padding: 2px 10px 2px calc(8px + var(--d) * 14px); cursor: pointer; white-space: nowrap; user-select: none; color: var(--ink); }
.tn:hover { background: var(--sel); text-decoration: none; }
.tn.on { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.tn .tw { width: 12px; color: var(--muted); font-size: 10px; flex: none; text-align: center; }
.tn .tl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tn .tc { color: var(--muted); font-size: 11px; }
.tn.fn .tl { font-family: var(--mono); font-size: 12.5px; }
.tn.top > .tl { font-weight: 600; }
.tn.d0 > .tl { font-weight: 600; }
.tn .sec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.draft { background: transparent; box-shadow: inset 0 0 0 1.5px var(--warn); }
.dot.asm { background: var(--muted); }
.dot.none { background: transparent; }
#view { overflow: auto; min-width: 0; }
.page { padding: 18px 28px 60px; max-width: 1400px; }
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }
h1.t { font-size: 24px; margin: 0; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1.t.mono { font-family: var(--mono); font-size: 21px; letter-spacing: 0; }
h1.t .step { font: 13px system-ui, sans-serif; color: var(--muted); font-weight: 400; }
.lede { font-size: 15px; margin: 10px 0 0; max-width: 820px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.badge { font-size: 12px; padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.badge.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
a.badge:hover { border-color: var(--accent); text-decoration: none; }
.badge.mono { font-family: var(--mono); font-size: 11.5px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 10px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
h3 .n { font-weight: 500; letter-spacing: 0; text-transform: none; }
.muted, .empty { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.notice { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 13px; }

/* recent updates */
.changes { max-width: 980px; font-size: 13px; }
.changes details { border-bottom: 1px solid var(--line); }
.changes summary { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 12px; padding: 5px 0; cursor: pointer; list-style: none; }
.changes summary::-webkit-details-marker { display: none; }
.changes details.none summary { cursor: default; color: var(--muted); }
.changes .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.changes .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes .ok { color: var(--ok); } .changes .warn { color: var(--warn); } .changes .bad { color: var(--accent); }
.changes .lab { font-size: 11.5px; color: var(--muted); margin: 6px 0 4px; }
.changes .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
/* history graph */
.hist { max-width: 760px; }
.hist svg { width: 100%; height: auto; display: block; font-size: 10.5px; }
.hist text { fill: var(--muted); }
.hist .g { stroke: var(--line); stroke-width: 1; }
.hist path { fill: none; stroke-width: 2; stroke-linejoin: round; }
.hist .m, .hist i.m { stroke: var(--muted); background: var(--muted); }
.hist .c, .hist i.c { stroke: var(--ok); background: var(--ok); }
.hist .cur { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; }
.hist .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 4px; }
.hist .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
/* stat tiles and bars */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 18px; }
.tile { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; }
.tile b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.tile span { color: var(--muted); font-size: 12.5px; }
.bar { height: 8px; border-radius: 4px; background: var(--warn); overflow: hidden; width: 100%; min-width: 80px; display: block; }
.bar > i { display: block; height: 100%; background: var(--ok); }
table.t { border-collapse: collapse; font-size: 13px; width: 100%; }
table.t td, table.t th { padding: 5px 14px 5px 0; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.link { cursor: pointer; }
table.t tr.link:hover td { background: var(--sel); }
.kinds { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 12px; align-items: center; max-width: 760px; font-size: 13px; }
.kinds a { color: var(--ink); }
.kinds .kb { height: 8px; border-radius: 4px; background: var(--warn); }
.strip { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); margin: 14px 0 4px; }
.strip a { display: block; height: 100%; background: var(--ok); border-right: 1px solid var(--panel); min-width: 2px; }
.strip a.warn { background: var(--warn); }
.strip a.draft { background: var(--warn-bg); }
.strip a.asm { background: var(--muted); }
.strip a.sel { outline: 2px solid var(--ink); outline-offset: -2px; }

/* source panes */
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 18px; }
@media (max-width: 1100px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.pane { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; display: flex; flex-direction: column; }
.pane .ph { display: flex; align-items: baseline; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pane .ph b { color: var(--ink); font-weight: 600; font-size: 12.5px; }
.pane .ph .sp { flex: 1; }
.src { overflow: auto; max-height: 72vh; font: 12.5px/1.55 var(--mono); padding: 6px 0; }
.src .l { display: flex; white-space: pre; padding-right: 12px; }
.src .l .g { color: var(--muted); opacity: .7; text-align: right; flex: none; width: 4.2em; padding-right: 12px; user-select: none; }
.src .l .off { color: var(--syn-num); opacity: .8; flex: none; width: 5.2em; padding-right: 8px; text-align: right; user-select: none; }
.src .l.cx { background: var(--warn-bg); box-shadow: inset 3px 0 var(--warn); }
.src .l.cx .g { color: var(--warn); opacity: 1; }
.src .k { color: var(--syn-kw); }
.src .ty { color: var(--syn-type); }
.src .nu { color: var(--syn-num); }
.src .s { color: var(--syn-str); }
.src .c { color: var(--syn-com); font-style: italic; }
.src .op { color: var(--syn-kw); font-weight: 550; }
.src .rg { color: var(--syn-type); }
.src .lb { color: var(--ink); font-weight: 600; }
.src a { color: var(--syn-fn); }
.src a.ram { color: var(--syn-type); text-decoration: underline dotted; }
.src .ann { color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; background: var(--warn-bg); box-shadow: inset 2px 0 var(--warn); vertical-align: -1px; margin-right: 4px; }

/* cross-references */
.xr { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 28px; }
.refs { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); white-space: nowrap; color: var(--ink); }
.chip.mono { font-family: var(--mono); font-size: 12px; }
a.chip:hover { border-color: var(--accent); text-decoration: none; }
.chip small { color: var(--muted); }
.chip.warn { border-color: var(--warn); }
.results .r { display: flex; gap: 8px; align-items: baseline; padding: 3px 10px; cursor: pointer; color: var(--ink); }
.results .r:hover { background: var(--sel); text-decoration: none; }
.results .r .k { font-size: 10.5px; color: var(--muted); width: 34px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.results .r .p { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #side { height: 40vh; } .page { padding: 14px 16px 40px; } }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="side">
    <div class="tools"><input id="q" type="search" placeholder="Find a function, unit, type or RAM object" autocomplete="off"></div>
    <div id="tree"></div>
  </section>
  <section id="view"><div class="page empty">Loading the code index…</div></section>
</main>
<script src="/static/common.js"></script>
<script>
// The code explorer: every function by category and unit (the report tree that
// PROGRESS.json and decomp.dev show), its C next to its disassembly, the
// concessions it still holds, and what it touches (tools/studio/codemap.py).
// Routes: #ADDRESS or #fn:NAME, #cat:CATEGORY, #unit:CATEGORY/UNIT, #ram, #ram:NAME.
studioHeader();
let S = null;                       // /api/codemap
const FN = {}, BYNAME = {}, UNIT = {}, RAMS = [];
const open = new Set();
const KIND_LABEL = { pin: 'register pin', operand: 'asm operand', clobber: 'asm clobber', barrier: 'asm barrier', 'debug-nop': 'debug nop',
  'empty-loop': 'empty loop', 'empty-if': 'empty if', 'single-use-macro': 'single-use macro', volatile: 'volatile', alias: 'asm alias',
  cflags: 'compiler flags', 'raw-offset': 'raw offset', helper: 'through a helper', concession: 'concession' };
const KIND_HELP = { pin: 'register T x asm("rN"): forces a register choice', operand: 'asm("" : "+r"(x)): an empty asm that pins a value in a register',
  clobber: 'asm("" ::: "rN"): an empty asm that blocks a register', barrier: 'asm(""): an empty asm that stops an optimization',
  'debug-nop': 'DEBUG_NOP(): a stand-in for compiled-out debug code', 'raw-offset': '*(u16 *)((u8 *)p + 0x172) where a struct field belongs',
  helper: 'calls a static helper or macro that holds one', volatile: 'a volatile local or cast that steers the compiler',
  'single-use-macro': 'a statement macro used at one site', 'empty-loop': 'do { } while (0)', 'empty-if': 'an if with an empty body',
  alias: 'a second prototype through asm("Symbol")', cflags: 'a // CFLAGS: override' };
const kindLabel = k => KIND_LABEL[k] || k;
const num = n => Number(n).toLocaleString();
const kb = n => n >= 10240 ? `${num(Math.round(n / 1024))} KB` : `${num(n)} B`;
const pct = (a, b) => b ? 100 * a / b : 100;
const fmtPct = p => (p >= 99.95 && p < 100 ? '99.9' : p.toFixed(p >= 10 ? 1 : 2)) + '%';
const unitKey = (c, u) => `${c}/${u}`;
const fnHref = a => '#' + a;
const unitHref = (c, u) => '#unit:' + encodeURIComponent(unitKey(c, u));
const catHref = c => '#cat:' + encodeURIComponent(c);
const ramHref = n => '#ram:' + encodeURIComponent(n);
const status = kinds => kinds.length
  ? kinds.map(k => `<span class="badge warn" title="${esc(KIND_HELP[k] || '')}">${esc(kindLabel(k))}</span>`).join('')
  : '<span class="badge ok">no concessions</span>';
// a function's state: matches without concessions (ok), matches with some (warn; its
// percent is decomp.dev's share of lines without one), not matched yet: a NONMATCHING
// draft or nothing (draft), or SDK assembly that stays assembly (asm)
const ASM_CAT = 'Intentional assembly';
const stateOf = f => f.unit?.cat === ASM_CAT ? 'asm' : f.kinds.length ? 'warn' : f.pct < 100 ? 'draft' : 'ok';
const STATE_TITLE = { ok: 'matches, no concessions', warn: 'matches with concessions', draft: 'not matched yet', asm: 'hand-written assembly' };
const fdot = f => `<span class="dot ${f.state}" title="${STATE_TITLE[f.state]}"></span>`;
// the badges for a category or unit: drafts, concessions, or neither
const groupBadges = g => g.cat === ASM_CAT || g.name === ASM_CAT ? '<span class="badge">hand-written assembly</span>'
  : (g.ndraft ? `<span class="badge warn">${g.ndraft} not matched yet</span>` : '') + (g.ncx ? `<span class="badge warn">${g.ncx} with concessions</span>` : '')
  || '<span class="badge ok">no concessions</span>';
const fnBadges = f => f.state === 'asm' ? '<span class="badge">assembly</span>'
  : f.state === 'draft' ? `<span class="badge warn">${f.pct ? 'draft · ' + fmtPct(f.pct) : 'not started'}</span>` : status(f.kinds);
const bar = (clean, total) => `<span class="bar" title="${fmtPct(pct(clean, total))} of the bytes without concessions"><i style="width:${pct(clean, total)}%"></i></span>`;

// ---------- index ----------
async function load() {
  S = await fetch('/api/codemap').then(r => r.ok ? r.json() : Promise.reject(r.status));
  for (const k of Object.keys(FN)) delete FN[k];
  for (const k of Object.keys(BYNAME)) delete BYNAME[k];
  for (const k of Object.keys(UNIT)) delete UNIT[k];
  RAMS.length = 0; ramNames.s = null; typeNames.s = null;
  for (const c of S.categories) {
    c.size = 0; c.clean = 0; c.nfn = 0; c.ncx = 0; c.ndraft = 0;
    for (const u of c.units) {
      u.cat = c.name; u.size = 0; u.clean = 0; u.ncx = 0; u.ndraft = 0; u.files = new Set();
      for (const [name, addr, size, p, kinds, file] of u.functions) {
        const f = { name, addr, size, pct: p, kinds, file, unit: u };
        f.state = stateOf(f);
        FN[addr] = f; BYNAME[name] = f;
        u.size += size; if (f.state === 'ok') u.clean += size;
        if (kinds.length) u.ncx++;
        if (f.state === 'draft') u.ndraft++;
        if (file) u.files.add(file);
      }
      UNIT[unitKey(c.name, u.name)] = u;
      c.size += u.size; c.clean += u.clean; c.nfn += u.functions.length; c.ncx += u.ncx; c.ndraft += u.ndraft;
    }
  }
  for (const r of S.ram) RAMS.push({ ...r, start: parseInt(r.addr, 16) });
  RAMS.sort((a, b) => a.start - b.start);
}
// the RAM object holding an address, for the disassembly's literal pools
function ramAt(a) {
  let lo = 0, hi = RAMS.length - 1, best = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (RAMS[m].start <= a) { best = RAMS[m]; lo = m + 1; } else hi = m - 1; }
  return best && a < best.start + Math.max(best.size, 1) ? best : null;
}

// ---------- sidebar ----------
let SEL = '';
function renderTree() {
  const q = $('q').value.trim().toLowerCase();
  if (q) return renderResults(q);
  const out = [];
  const row = (d, cls, hash, tw, label, count, dot) =>
    out.push(`<a class="tn ${cls}${SEL === hash ? ' on' : ''}" style="--d:${d}" href="${hash}" data-key="${esc(hash)}">${tw}${dot ?? ''}<span class="tl">${label}</span>${count != null ? `<span class="tc">${count}</span>` : ''}</a>`);
  row(0, 'top', '#', '<span class="tw">◎</span>', 'Overview');
  row(0, 'top', '#ram', '<span class="tw">▦</span>', 'RAM objects', num(S.ram.length));
  row(0, 'top', '#types', '<span class="tw">{}</span>', 'Types', num((S.types || []).length));
  row(0, 'top', '#left', '<span class="tw">◆</span>', 'Concessions left', num(Object.values(FN).filter(f => f.kinds.length).length));
  for (const c of S.categories) {
    const ck = catHref(c.name), co = open.has(ck);
    row(0, 'd0', ck, `<span class="tw" data-tog="${esc(ck)}">${co ? '▾' : '▸'}</span>`, esc(c.name), num(c.nfn));
    if (!co) continue;
    for (const u of c.units) {
      const uk = unitHref(c.name, u.name), uo = open.has(uk);
      row(1, '', uk, `<span class="tw" data-tog="${esc(uk)}">${uo ? '▾' : '▸'}</span>`, esc(u.name), u.functions.length,
        u.cat === ASM_CAT ? '<span class="dot asm" title="hand-written assembly"></span>'
          : `<span class="dot${u.ndraft ? ' draft' : u.ncx ? ' warn' : ''}" title="${[u.ndraft && u.ndraft + ' not matched yet', u.ncx && u.ncx + ' with concessions'].filter(Boolean).join(', ') || 'no concessions'}"></span>`);
      if (!uo) continue;
      for (const [, addr] of u.functions)
        row(2, 'fn', fnHref(addr), '<span class="tw"></span>', esc(FN[addr].name), null, fdot(FN[addr]));
    }
  }
  $('tree').innerHTML = out.join('');
  document.querySelector('#tree .tn.on')?.scrollIntoView({ block: 'nearest' });
}
function renderResults(q) {
  const out = [], hit = s => s.toLowerCase().includes(q);
  const units = Object.values(UNIT).filter(u => hit(u.name)).slice(0, 40);
  const fns = Object.values(FN).filter(f => hit(f.name) || f.addr.toLowerCase().includes(q.replace(/^0x|^sub_/, ''))).slice(0, 300);
  const rams = S.ram.filter(r => hit(r.name) || r.addr.toLowerCase().includes(q)).slice(0, 60);
  const types = (S.types || []).filter(hit).slice(0, 40);
  const r = (k, href, label, path, dot = '') => out.push(`<a class="r" href="${href}"><span class="k">${k}</span>${dot}<span class="mono">${label}</span><span class="p">${esc(path)}</span></a>`);
  for (const u of units) r('unit', unitHref(u.cat, u.name), esc(u.name), u.cat);
  for (const f of fns) r('fn', fnHref(f.addr), esc(f.name), f.unit.name, fdot(f));
  for (const x of rams) r('ram', ramHref(x.name), esc(x.name), x.addr);
  for (const t of types) r('type', typeHref(t), esc(t), 'struct');
  $('tree').innerHTML = `<div class="results">${out.join('') || '<div class="empty" style="padding:8px 12px">Nothing matches.</div>'}</div>`;
}
$('q').oninput = renderTree;
$('q').onkeydown = e => { if (e.key === 'Enter') { const a = document.querySelector('#tree .r'); if (a) location.hash = a.getAttribute('href'); } };
$('tree').addEventListener('click', e => {
  const t = e.target.closest('[data-tog]');
  if (!t) return;
  e.preventDefault();
  const k = t.dataset.tog; open.has(k) ? open.delete(k) : open.add(k); renderTree();
});

// ---------- pages ----------
const crumbs = (...parts) => `<div class="crumbs"><a href="#">Code</a>${parts.map(p => ' › ' + p).join('')}</div>`;
function overview() {
  const m = S.measures, total = +m.total_code, clean = +m.complete_code, nfn = m.total_functions;
  const drafts = Object.values(FN).filter(f => f.state === 'draft').length;
  const ncx = Object.values(FN).filter(f => f.kinds.length).length, kinds = Object.entries(S.concession_kinds).sort((a, b) => b[1] - a[1]);
  const kmax = Math.max(1, ...kinds.map(k => k[1]));
  return `<div class="page">${crumbs()}
    <h1 class="t">${drafts ? `${num(nfn - drafts)} of ${num(nfn)} functions match` : 'Every function matches'}</h1>
    <p class="lede">${drafts ? `${num(nfn - drafts)} of the ${num(nfn)} functions in the ROM compile from C to the original bytes; the other
      ${drafts} are <a href="#left:draft">drafts</a> still built from their assembly.` : `All ${num(nfn)} functions in the ROM compile from C to the original bytes.`} ${fmtPct(m.complete_code_percent)} of the code is also
      ordinary C with no matching concession; the rest still steers the compiler with a register pin, an empty <code>asm("")</code> or one of the other
      kinds below, and removing those is the current work. Pick a category, a unit or a function, or search on the left.</p>
    ${(S.missing || []).map(x => `<div class="notice">Not available here: ${esc(x)}.</div>`).join('')}
    ${S.updating ? '<div class="notice">The sources changed: a new index is building (about half a minute); this page updates when it is ready.</div>' : ''}
    <div class="tiles">
      <div class="tile"><b>${num(nfn)}</b><span>${drafts ? `functions, ${drafts} not matched yet` : 'functions, all matching'}</span></div>
      <div class="tile"><b>${kb(total)}</b><span>of code in ${num(m.total_units ?? Object.keys(UNIT).length)} units</span></div>
      <div class="tile"><b>${fmtPct(m.complete_code_percent)}</b><span>of the code without concessions</span></div>
      <div class="tile"><b>${num(ncx)}</b><span>functions still with a concession (${kb(total - clean)})</span></div>
      <div class="tile"><b>${num(S.ram.length)}</b><span>named RAM objects</span></div>
    </div>
    <h3>Over time <span class="n">from each committed PROGRESS.md</span></h3><div id="hist" class="hist"><span class="empty">Loading the history…</span></div>

const C_KW = new Set('if else for while do switch case default break continue return goto sizeof static const volatile extern register struct union enum typedef inline asm'.split(' '));
const C_TY = new Set('void char short int long unsigned signed float double bool u8 u16 u32 u64 s8 s16 s32 s64 vu8 vu16 vu32 vs8 vs16 vs32 bool8 bool16 bool32 fx16 fx32 f32'.split(' '));
const ramNames = () => (ramNames.s ??= new Set(S.ram.map(r => r.name)));

const typeHref = n => '#type:' + encodeURIComponent(n);

function linesOf(tokens) {

    text.split('\n').forEach((part, i) => {
      if (i) lines.push([]);
      if (!part) return;
      const t = esc(part);
      lines.at(-1).push(href ? `<a href="${href}"${cls ? ` class="${cls}"` : ''}${title ? ` title="${esc(title)}"` : ''}>${t}</a>` : cls ? `<span class="${cls}">${t}</span>` : t);

function cTokens(src, self) {

    else if (str) out.push(['s', t]);
    else if (n) out.push(['nu', t]);
    else if (pp) out.push(['k', t]);
    else if (id) {
      if (C_KW.has(id)) out.push(['k', id]);
      else if (C_TY.has(id)) out.push(['ty', id]);
      else if ((after === 'struct' || after === 'union') && typeNames().has(id)) out.push(['ty', id, typeHref(id), 'struct layout']);
      else if (BYNAME[id] && id !== self) out.push(['', id, fnHref(BYNAME[id].addr), BYNAME[id].unit.name]);
      else if (ramNames().has(id)) out.push(['ram', id, ramHref(id), 'RAM object']);

}
function asmTokens(src) {
  const out = [];
  for (const line of src.split('\n')) {
    let m;
    if ((m = line.match(/^(\w+):(.*)$/))) { out.push(['lb', m[1] + ':'], ['c', m[2]], ['', '\n']); continue; }
    const [code, ...rest] = line.split(' @ ');
    const cm = rest.join(' @ ');
    const im = code.match(/^(\s*)(\.?[\w.]+)(.*)$/);
    if (!im) { out.push(['', code + '\n']); continue; }
    out.push(['', im[1]], [im[2].startsWith('.') ? 'k' : 'op', im[2]]);
    const ops = im[3];
    const rx = /(\b(?:r\d+|sp|lr|pc|sl|fp|ip|sb)\b)|(#-?(?:0x[0-9a-fA-F]+|\d+))|(0x[0-9A-Fa-f]+)|([A-Za-z_]\w*)|([\s\S])/g;
    let t;
    while ((t = rx.exec(ops))) {
      if (t[1]) out.push(['rg', t[1]]);
      else if (t[2] || t[3]) out.push(['nu', t[0]]);
      else if (t[4] && BYNAME[t[4]]) out.push(['', t[4], fnHref(BYNAME[t[4]].addr), BYNAME[t[4]].unit.name]);
      else out.push(['', t[0]]);
    }
    if (cm) {
      const lit = cm.match(/^=(0x[0-9A-Fa-f]+|\w+)$/);
      if (lit && BYNAME[lit[1]]) out.push(['c', ' @ ='], ['', lit[1], fnHref(BYNAME[lit[1]].addr)]);
      else if (lit && lit[1].startsWith('0x')) {
        const v = parseInt(lit[1], 16), r = ramAt(v), f = FN[((v & ~1) >>> 0).toString(16).toUpperCase().padStart(8, '0')];
        out.push(['c', ' @ =' + lit[1]]);
        if (r) out.push(['ann', '  '], ['ram', r.name + (v > r.start ? `+0x${(v - r.start).toString(16)}` : ''), ramHref(r.name), 'RAM object']);
        else if (f) out.push(['ann', '  '], ['', f.name, fnHref(f.addr)]);

    }

  }

    ${o.decl ? `<div class="pane" style="margin-top:14px"><div class="src" style="padding:8px 12px">${linesOf(cTokens(o.decl)).join('<br>')}</div></div>` : ''}
    ${o.notes ? `<p class="lede" style="font-size:14px">${esc(o.notes)}</p>` : ''}
    <h3>Used by <span class="n">${d.users.length} functions in ${Object.keys(by).length} units</span></h3>
    ${Object.entries(by).map(([k, us]) => { const [c, ...rest] = k.split('/'); const un = rest.join('/');
      return `<div style="margin-bottom:12px"><div style="margin-bottom:4px"><a href="${unitHref(c, un)}">${esc(un)}</a> <span class="muted">· ${esc(c)}</span></div><div class="refs">${us.map(x =>
        `<a class="chip mono${x.kinds.length ? ' warn' : ''}" href="${fnHref(x.addr)}">${esc(x.name)}${x.offsets.some(v => v) ? ` <small>${x.offsets.filter(v => v).map(v => '+0x' + v.toString(16)).join(' ')}</small>` : ''}</a>`).join('')}</div></div>`; }).join('') || '<div class="empty">No function loads its address directly (it may be reached through a pointer).</div>'}
  </div>`;
}
// the functions that still hold a concession (all, or one kind), smallest first: phase 3's queue
function leftPage(kind) {
  const drafts = Object.values(FN).filter(f => f.state === 'draft');
  if (kind === 'draft') return draftPage(drafts);
  const fns = Object.values(FN).filter(f => f.kinds.length && (!kind || f.kinds.includes(kind))).sort((a, b) => a.size - b.size || a.addr.localeCompare(b.addr));
  const bytes = fns.reduce((s, f) => s + f.size, 0);
  const kinds = Object.keys(S.concession_kinds).sort((a, b) => S.concession_kinds[b] - S.concession_kinds[a]);
  return `<div class="page">${crumbs('Concessions left')}
    <h1 class="t">${kind ? esc(kindLabel(kind)) : 'Concessions left'}</h1>
    <p class="lede">${num(fns.length)} functions (${kb(bytes)}) still match only with ${kind ? `a ${esc(kindLabel(kind))}${KIND_HELP[kind] ? ` (${esc(KIND_HELP[kind])})` : ''}` : 'a concession'}, smallest first.
      <code>tools/progress.py --list-pinned</code> is the same list.</p>
    ${leftBadges(kind, drafts.length)}
    <table class="t" style="margin-top:14px"><tr><th>Function</th><th class="r">Bytes</th><th>Kinds</th><th>Unit</th><th>Source</th></tr>
    ${fns.map(f => `<tr class="link" data-href="${fnHref(f.addr)}"><td class="mono"><a href="${fnHref(f.addr)}">${esc(f.name)}</a></td><td class="r">${f.size}</td>
      <td><div class="badges" style="margin:0">${status(f.kinds)}</div></td><td><a href="${unitHref(f.unit.cat, f.unit.name)}">${esc(f.unit.name)}</a></td><td class="mono muted" style="font-size:11.5px">${esc(f.file || '')}</td></tr>`).join('')}</table></div>`;
}
const leftBadges = (kind, ndraft) => `<div class="badges"><a class="badge${kind ? '' : ' warn'}" href="#left">all</a>${Object.keys(S.concession_kinds).sort((a, b) => S.concession_kinds[b] - S.concession_kinds[a])
  .map(k => `<a class="badge${k === kind ? ' warn' : ''}" href="#left:${esc(k)}">${esc(kindLabel(k))} ${S.concession_kinds[k]}</a>`).join('')}${ndraft ? `<a class="badge${kind === 'draft' ? ' warn' : ''}" href="#left:draft">not matched yet ${ndraft}</a>` : ''}</div>`;
function draftPage(fns) {
  fns = [...fns].sort((a, b) => a.addr.localeCompare(b.addr));
  return `<div class="page">${crumbs('<a href="#left">Concessions left</a>')}
    <h1 class="t">Not matched yet</h1>
    <p class="lede">${num(fns.length)} functions (${kb(fns.reduce((s, f) => s + f.size, 0))}) don't match yet. Their C is a draft inside
      <code>#ifdef NONMATCHING</code>, scored by how close it comes, and the build uses the <code>INCLUDE_ASM</code> branch. In ROM order.</p>
    ${leftBadges('draft', fns.length)}
    <table class="t" style="margin-top:14px"><tr><th>Function</th><th class="r">Bytes</th><th>Draft</th><th>Unit</th><th>Source</th></tr>
    ${fns.map(f => `<tr class="link" data-href="${fnHref(f.addr)}"><td class="mono"><a href="${fnHref(f.addr)}">${esc(f.name)}</a></td><td class="r">${f.size}</td>
      <td><div class="badges" style="margin:0">${fnBadges(f)}</div></td><td><a href="${unitHref(f.unit.cat, f.unit.name)}">${esc(f.unit.name)}</a></td><td class="mono muted" style="font-size:11.5px">${esc(f.file || '')}</td></tr>`).join('')}</table></div>`;
}
async function typePage(name) {
  const d = await fetch('/api/codemap/type/' + encodeURIComponent(name)).then(r => r.ok ? r.json() : null);
  if (!d) return notFound(`No struct or union ${name} in include/.`);
  document.title = d.name + ' · Boktai 3 Code';
  const by = {};
  for (const u of d.users) (by[`${u.category}/${u.unit}`] ||= []).push(u);
  const hex = n => '0x' + n.toString(16).toUpperCase();
  const fields = d.fields ? `<table class="t" style="max-width:640px"><tr><th class="r">Offset</th><th class="r">Size</th><th>Member</th></tr>${d.fields.map(([o, sz, m]) =>
    `<tr><td class="r mono">${hex(o)}</td><td class="r mono">${sz}</td><td class="mono">${esc(m)}</td></tr>`).join('')}</table>`
    : `<div class="empty">${d.measuring ? 'Measuring the layouts with agbcc (a few seconds); reload to see the offsets.' : 'No layout measured for this one (it may only compile with other headers).'}</div>`;
  return `<div class="page">${crumbs('<a href="#types">Types</a>')}
    <h1 class="t mono">${d.kind} ${esc(d.name)}</h1>
    <div class="badges">${d.size != null ? `<span class="badge">${d.size} bytes (${hex(d.size)})</span>` : ''}<span class="badge mono">${esc(d.file)}:${d.line}</span>
      ${d.aliases.map(a => `<span class="badge mono">typedef ${esc(a)}</span>`).join('')}<span class="badge">${d.users.length} functions use it</span></div>
    <div class="panes" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
      ${pane('Definition', `<span class="mono">${esc(d.file)}</span>${d.fields ? '<span class="sp"></span><span>offsets from agbcc</span>' : ''}`, linesOf(cTokens(d.text)),
        d.line - (d.text.slice(0, d.text.indexOf(d.kind + ' ' + d.name)).split('\n').length - 1), {}, d.fields ? offsetsByLine(d.text, d.fields) : null)}
      <div><h3 style="margin-top:0">Layout <span class="n">offsetof and sizeof as agbcc compiles them</span></h3>${fields}</div>
    </div>
    <h3>Used by <span class="n">${d.users.length} functions in ${Object.keys(by).length} units</span></h3>
    ${Object.entries(by).map(([k, us]) => { const [c, ...rest] = k.split('/'); const un = rest.join('/');
      return `<div style="margin-bottom:12px"><div style="margin-bottom:4px"><a href="${unitHref(c, un)}">${esc(un)}</a> <span class="muted">· ${esc(c)}</span></div><div class="refs">${us.map(x =>
        `<a class="chip mono${x.kinds.length ? ' warn' : ''}" href="${fnHref(x.addr)}">${esc(x.name)}</a>`).join('')}</div></div>`; }).join('') || '<div class="empty">No function names it.</div>'}
  </div>`;
}
// each top-level member's offset, beside the line that declares it
function offsetsByLine(text, fields) {
  const out = [], lines = text.split('\n');
  let j = 0, depth = 0;
  lines.forEach((ln, i) => {
    const code = ln.replace(/\/\/.*|\/\*.*?\*\//g, '');
    if (depth === 1 && j < fields.length) {
      const hit = [];
      while (j < fields.length && new RegExp('\\b' + fields[j][2] + '\\b').test(code)) { hit.push(fields[j]); j++; }
      if (hit.length) out[i] = '+0x' + hit[0][0].toString(16).toUpperCase();
    }
    for (const c of code) depth += (c === '{') - (c === '}');
    // a nested union or struct's own members aren't listed: its name on the closing line is
    if (depth === 1 && /^\s*\}\s*\w+/.test(code) && j < fields.length && new RegExp('\\b' + fields[j][2] + '\\b').test(code)) { out[i] = '+0x' + fields[j][0].toString(16).toUpperCase(); j++; }
  });
  return out;
}
function typeList() {
  return `<div class="page">${crumbs('Types')}
    <h1 class="t">Types</h1>
    <p class="lede">The structs and unions shared through <code>include/</code>, ${num((S.types || []).length)} of them. Each page shows the definition, the layout agbcc gives it and the functions that use it.</p>
    <div class="refs" style="margin-top:14px">${(S.types || []).map(t => `<a class="chip mono" href="${typeHref(t)}">${esc(t)}</a>`).join('')}</div></div>`;
}
const notFound = msg => `<div class="page"><div class="empty">${esc(msg)}</div></div>`;

// ---------- routing ----------
async function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const v = $('view');
  SEL = '#' + location.hash.slice(1);
  document.title = 'Boktai 3 Code';
  const slow = setTimeout(() => { v.innerHTML = `<div class="page empty">Loading ${esc(h)}…</div>`; }, 150);
  let html;
  if (!h) { SEL = '#'; html = overview(); }
  else if (h === 'ram') html = ramList();
  else if (h === 'types') html = typeList();
  else if (h.startsWith('type:')) html = await typePage(h.slice(5));
  else if (h === 'left' || h.startsWith('left:')) { html = leftPage(h.slice(5)); document.title = 'Concessions left · Boktai 3 Code'; }
  else if (h.startsWith('ram:')) html = await ramPage(h.slice(4));
  else if (h.startsWith('cat:')) { open.add(location.hash); html = categoryPage(h.slice(4)); document.title = h.slice(4) + ' · Boktai 3 Code'; }
  else if (h.startsWith('unit:')) {
    const u = UNIT[h.slice(5)];
    if (u) { open.add(catHref(u.cat)); open.add(location.hash); document.title = u.name + ' · Boktai 3 Code'; }
    html = unitPage(h.slice(5));
  } else html = await functionPage(h.startsWith('fn:') ? h.slice(3) : h);
  clearTimeout(slow);
  if (decodeURIComponent(location.hash.slice(1)) !== h) return;  // a newer route is on its way
  v.innerHTML = html;
  v.scrollTop = 0;
  renderTree();
  if (!h) { drawHistory(); drawChanges(); }
}
$('view').addEventListener('click', e => {
  const tr = e.target.closest('tr.link');
  if (tr && !e.target.closest('a')) location.hash = tr.dataset.href;
});
window.onhashchange = route;
// after a source change the server rebuilds in the background; pick up the new index when it lands
async function watchUpdate() {
  if (!S?.updating) return;
  const t = await fetch('/api/codemap').then(r => r.json()).catch(() => null);
  if (t && !t.updating) { await load(); route(); } else setTimeout(watchUpdate, 5000);
}
// only a first build is slow (tools/progress.py, about half a minute); say so if this is one
const slowNote = setTimeout(() => { const v = $('view').querySelector('.page.empty'); if (v && !S) v.textContent += ' The first visit after a source change runs tools/progress.py, about half a minute.'; }, 2500);
load().finally(() => clearTimeout(slowNote)).then(() => { route(); setTimeout(watchUpdate, 5000); }).catch(err => { $('view').innerHTML = notFound(`The code index failed to load (${err}). Check the Studio's terminal.`); });
</script>
