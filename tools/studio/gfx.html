<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boktai 3 Studio</title>
<link rel="stylesheet" href="/static/common.css">
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #2b2620; --muted: #7d7468; --line: #e3dccf;
  --accent: #b5462f; --accent-ink: #fff; --sel: #f3e3d6; --stage: #3b3f55; --checker: #464a62;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dc; --muted: #9a9083; --line: #3a352e;
    --accent: #e0745a; --accent-ink: #1b1916; --sel: #3a2c25;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: 6px; }
nav a.on { background: var(--sel); color: var(--ink); }
nav a:hover { color: var(--ink); }
.sp { flex: 1; }
select, input, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
main { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 53px); }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side .tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
#side .count { color: var(--muted); font-size: 12px; }
#list { overflow-y: auto; flex: 1; }
.row { padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.row:hover { background: var(--sel); }
.row.on { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.row code { font-size: 12px; }
.row .n { color: var(--muted); font-size: 12px; margin-left: auto; }
.row .note { color: var(--accent); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#view { overflow: auto; padding: 16px 20px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.stage { background: var(--stage); background-image: conic-gradient(var(--checker) 25%, transparent 0 50%, var(--checker) 0 75%, transparent 0); background-size: 16px 16px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; padding: 12px; min-width: 160px; min-height: 120px; }
canvas { image-rendering: pixelated; display: block; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.cell { background: var(--stage); border-radius: 6px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid transparent; }
.cell.on { border-color: var(--accent); }
.cell span { font-size: 10px; color: #cfd2e6; font-variant-numeric: tabular-nums; text-align: center; max-width: 88px; }
.cell .flab { display: block; font-weight: 500; color: #ffd9a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.grid .cell { height: 96px; justify-content: center; }
.pal { display: grid; grid-template-columns: repeat(16, 14px); gap: 1px; }
.pal i { width: 14px; height: 14px; display: block; }
.palcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; background: var(--panel); }
.palcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.palcard code { font-size: 12px; }
.palgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 8px 0; flex-wrap: wrap; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.row .lab { color: var(--ink); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ms svg * { pointer-events: auto; }
body.embed #side { display: none; }
body.embed main { grid-template-columns: 1fr; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #side { height: 40vh; } }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="side">
    <div class="tools"><input id="q" type="search" placeholder="Filter by hash or note" autocomplete="off"><div class="count" id="count"></div></div>
    <div id="list"></div>
  </section>
  <section id="view"></section>
</main>
<div id="tip"></div>
<script src="/static/common.js"></script>
<script>
studioHeader(`<label style="font-size:13px;color:var(--muted)">Palette <select id="palSel"></select></label>
  <label style="font-size:13px;color:var(--muted)">Zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>`);
if (EMBED) document.body.insertAdjacentHTML('afterbegin', '<div hidden><select id="palSel"></select><select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>');
if (new URLSearchParams(location.search).has('live')) $('zoom').value = '1';  // the Live page's map: the whole stage at once
// Tentative identifications from docs/ASSETS.md (visual guesses unless noted).
const NOTES = {
  B96C: 'slime (name hash confirmed; red in game)', 9506: 'bee (name hash confirmed)', DA6D: 'bat', 9247: 'ghoul / zombie', D637: 'hooded figure (wraith?)', D28E: 'flame / wisp (runs in field)',
  '5A6E': 'crow / raven?', '528F': 'spider?', D636: 'octopus?', 5290: 'golem (clay/rock)', '48DE': 'mummy', D635: 'hound', 3876: 'mimic (treasure chest)',
  D291: 'flame worm (モエルルン?)', D638: 'green worm (クロロホルルン?)', 5291: 'living sword', '3DB6': 'black winged creature', AE52: 'skeletons', '0658': 'sword-wielder', '158A': 'man in coat',
  DE23: 'playable character', '761E': 'character (1253 frames)', F761: 'large beast', F771: 'large bird', F7D2: 'boss face', A2DB: 'eruption effect', '1BC7': 'flames',
  DF11: 'light bulb', '731D': 'copyright line', '82F1': 'PURIFICATION COMPLETED!', E89F: 'Boktai 2 title',
};

let palPicked = false;  // the palette menu was used this session: it overrides a stage's own palette
let index = {}, palettes = [], curPal = null, zoom = +$('zoom').value, big = null, font = null, charmap = {};
function palColors(p) { // 256 RGB triples, or a grey ramp
  if (!p) return Array.from({ length: 256 }, (_, i) => { const v = (i & 15) * 17; return [v, v, v]; });
  return Array.from({ length: 256 }, (_, i) => rgb(le(p.data, 20 + i * 2)));
}


// ---------- shell ----------
let tab = 'sprites', items = [], sel = null, timer = null;
const views = {};

let learned = { stages: [], sprites: {} }, tagList = [];
async function boot() {
  index = await fetch('/api/res').then(r => r.json());
  await loadNotes();
  learned = await fetch('/api/learned').then(r => r.json()).catch(() => learned);
  tagList = await fetch('/api/tags').then(r => r.json()).catch(() => []);
  const ps = index.t92B3 || [];
  palettes = await Promise.all(ps.map(async ([h]) => ({ hash: h, data: await res('t92B3', h) })));
  $('palSel').innerHTML = '<option value="">Greyscale</option>' + palettes.map((p, i) => `<option value="${i}">${p.hash}</option>`).join('');
  const saved = localStore('pal');
  $('palSel').value = saved ?? String(palettes.findIndex(p => p.hash === '081B'));
  curPal = palettes[+$('palSel').value] || null;
  $('palSel').onchange = () => { curPal = palettes[+$('palSel').value] || null; palPicked = true; localStore('pal', $('palSel').value); refresh(); };
  $('zoom').onchange = () => { zoom = +$('zoom').value; refresh(); };
  $('q').oninput = renderList;
  listKeys(() => $('list'), '.row');
  window.onhashchange = route;
  route();
}
// Notes (data/notes.csv) per tab: kind and key of the selected item.
const NOTE_KIND = { sprites: 'spr', big: 'big', maps: 'map', palettes: 'pal', tiles: 'res', data: 'res' };
const noteKeyOf = key => tab === 'maps' ? key.split('-')[0] : key;
const labelOf = i => NOTE_KIND[tab] && noteOf(NOTE_KIND[tab], noteKeyOf(i.key))?.label;
// labels of a package's frames, for searching ("Healing Potion" finds 5D04)
const frameLabels = i => (tab === 'sprites' || tab === 'big') ? Object.values(NOTES_DB).filter(n => n.kind === (tab === 'big' ? 'bigframe' : 'sprframe') && n.key.startsWith(i.key + '/')).map(n => n.label).concat(tab === 'sprites' ? Object.entries(ITEM_FRAMES).filter(([k]) => k.startsWith(i.key + '/')).flatMap(([, l]) => l.map(x => x.name + ' ' + x.jp)) : []).join(' ') : '';
let wantFrame = null;

function route() {
  const [t, s, f] = (location.hash.slice(1) || 'sprites').split('/');
  tab = views[t] ? t : 'sprites';
  wantFrame = f !== undefined && f !== '' ? +f : null;
  markNav();
  views[tab].init().then(() => {
    renderList();
    // a map hash alone opens its stage entry (MAP-TILESET-HP) when there is one
    const key = s && (items.find(i => i.key === s) || items.find(i => i.key.startsWith(s + '-')) || items.find(i => i.key.toUpperCase() === s.toUpperCase()))?.key;
    if (key) select(key, true); else if (s && views[tab].free) select(s); else if (!sel || !items.some(i => i.key === sel)) select(items[0]?.key); else refresh();
  });
}
function renderList() {
  const q = $('q').value.trim().toUpperCase();
  const hits = items.filter(i => !q || i.key.includes(q) || (i.note || '').toUpperCase().includes(q) || (labelOf(i) || '').toUpperCase().includes(q) || frameLabels(i).toUpperCase().includes(q));
  $('count').textContent = `${hits.length} of ${items.length}`;
  $('list').replaceChildren(...hits.map(i => {
    const d = document.createElement('div');
    d.className = 'row' + (i.key === sel ? ' on' : '');
    d.dataset.key = i.key;
    const lab = labelOf(i);
    d.innerHTML = `<code>${i.key}</code>${lab ? '<span class="lab"></span>' : ''}${i.note ? `<span class="note"></span>` : ''}<span class="n">${i.n ?? ''}</span>`;
    if (lab) d.querySelector('.lab').textContent = lab;
    if (i.note) d.querySelector('.note').textContent = i.note;
    d.onclick = () => { history.replaceState(null, '', `#${tab}/${i.key}`); select(i.key); };
    return d;
  }));
}
function select(key, scroll) {
  sel = key;
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.key === key));
  if (scroll) document.querySelector('.row.on')?.scrollIntoView({ block: 'center' });
  refresh();
}
async function refresh() {
  clearInterval(timer); timer = null;
  if (sel === undefined) return;
  await views[tab].show(sel);
  const h = $('view').querySelector('h2');
  if (h && NOTE_KIND[tab] && sel && !LIVE) h.after(noteEditor(NOTE_KIND[tab], noteKeyOf(sel), renderList));
  wantFrame = null;
}
const colorsNow = () => palColors(curPal);
// A sprite's palette as captured in-game (tools/mgba/centaur.lua capture), for every bank.
function learnedColors(kind, hash) {
  return learnedPalette(learned.sprites[`${kind}:${hash}`]);
}
function learnedNote(kind, hash) {
  const L = learned.sprites[`${kind}:${hash}`];
  if (!L) return '';
  return L.source === 'code' ? ' · <span style="color:var(--accent)">palette from the code (tools/assets/bigpalettes.py)</span>'
    : ' · <span style="color:var(--accent)">colors from an in-game capture</span>';
}
const bigPool = {};  // a chosen variant palette per large sprite
function tagButton(kind, hash, part = '') {
  const t = tagList.find(x => x.kind === kind && x.hash === hash && x.part === String(part));
  const b = document.createElement('button');
  b.textContent = t ? `Text: ${t.note || 'tagged'} (${t.status})` : 'Has text…';
  b.onclick = async () => {
    const note = prompt(`What text does ${kind} ${hash}${part !== '' ? ' ' + part : ''} show?`, t?.note || '');
    if (note === null) return;
    tagList = await fetch('/api/tags', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, hash, part, note, english: t?.english || '', status: t?.status || 'todo' }) }).then(r => r.json());
    b.textContent = `Text: ${note} (${t?.status || 'todo'})`;
  };
  return b;
}

// Every animation of a package playing at once, a page at a time.
let animTimer = null;
function animGrid(pkg, colors, open) {
  clearInterval(animTimer);
  const grid = $('anims'), PAGE = 60, players = [];
  let shown = 0;
  const more = document.createElement('button'); more.className = 'more';
  grid.after(more);
  const add = () => {
    for (const end = Math.min(pkg.anims.length, shown + PAGE); shown < end; shown++) {
      const i = shown, a = pkg.anims[i];
      const fs = a.keys.map(k => pkg.frames[k.frame] ? pkg.parts(pkg.frames[k.frame]) : []), all = fs.flat();
      if (!all.length) continue;
      const box = [Math.min(...all.map(p => p.x)), Math.min(...all.map(p => p.y)), Math.max(...all.map(p => p.x + p.w)), Math.max(...all.map(p => p.y + p.h))];
      const imgs = fs.map(f => compose(f, colors, box));
      const c = document.createElement('div'); c.className = 'cell'; c.title = `animation #${i} (id ${a.id}, ${a.keys.length} keys)`;
      const cv = document.createElement('canvas'); cv.width = box[2] - box[0]; cv.height = box[3] - box[1];
      const s = Math.min(2, 72 / Math.max(cv.width, cv.height)); cv.style.width = cv.width * s + 'px'; cv.style.height = cv.height * s + 'px';
      c.append(cv); c.insertAdjacentHTML('beforeend', `<span>#${i}</span>`);
      c.onclick = () => open(i);
      grid.appendChild(c);
      players.push({ cv, imgs, keys: a.keys, k: 0, left: 0 });
    }
    more.hidden = shown >= pkg.anims.length; more.textContent = `Show more animations (${pkg.anims.length - shown} left)`;
  };
  more.onclick = add; add();
  animTimer = setInterval(() => {
    if (!document.body.contains(grid)) return clearInterval(animTimer);
    for (const p of players) {
      if (--p.left > 0) continue;
      p.k = (p.k + 1) % p.keys.length; p.left = Math.max(1, p.keys[p.k].dur || 8);
      const img = p.imgs[p.k], ctx = p.cv.getContext('2d');
      ctx.clearRect(0, 0, p.cv.width, p.cv.height); if (img) ctx.putImageData(img, 0, 0);
    }
  }, 1000 / 60);
}

let _caps = null;
const capturesList = () => (_caps ??= fetch('/api/captures').then(r => r.json()).catch(() => []));

// The frames of a sprite, a page at a time; click one (or pass `pick`) to show it still.
// Frames can be labelled one by one (notes kind sprframe/bigframe, key HASH/FRAME).
function frameStrip(n, imgAt, pick, kind, hash) {
  const strip = $('strip'), PAGE = 600, cells = [];
  let shown = 0;
  const more = document.createElement('button'); more.className = 'more';
  strip.appendChild(more);
  const lab = i => noteOf(kind, `${hash}/${i}`)?.label || (kind === 'sprframe' && itemLabel(hash, i));
  const caption = (c, i) => { const l = lab(i); c.querySelector('span').innerHTML = `${i}${l ? `<b class="flab">${esc(l)}</b>` : ''}`; c.title = l || ''; };
  const mark = i => cells.forEach((c, k) => c.classList.toggle('on', k === i));
  const still = i => {
    clearInterval(timer); const img = imgAt(i); $('stage').replaceChildren(img ? toCanvas(img, zoom) : ''); mark(i);
    history.replaceState(null, '', `#${tab}/${hash}/${i}`);
    const fn = $('framenote');
    if (fn) {
      const its = ITEM_FRAMES[`${hash}/${i}`] || [];
      fn.innerHTML = `<div class="meta" style="margin:6px 0 0">Frame ${i}${its.length ? ' · icon of ' + its.map(x => `${x.category} ${x.id} <b>${esc(x.name)}</b> (${esc(x.jp)}, string ${peekLink('/#' + x.string, '#' + x.string)})`).join(', ') : ''}</div>`; fn.appendChild(noteEditor(kind, `${hash}/${i}`, () => caption(cells[i], i)));
    }
  };
  const add = upto => {
    while (shown < Math.min(n, upto)) {
      const i = shown++, img = imgAt(i), c = document.createElement('div');
      c.className = 'cell';
      if (img) c.appendChild(toCanvas(img, 1));
      c.insertAdjacentHTML('beforeend', `<span></span>`); caption(c, i);
      c.onclick = () => still(i);
      strip.insertBefore(c, more); cells[i] = c;
    }
    more.hidden = shown >= n; more.textContent = `Show ${Math.min(PAGE, n - shown)} more of ${n - shown} frames`;
  };
  more.onclick = () => add(shown + PAGE);
  add(pick != null ? Math.max(PAGE, pick + 1) : PAGE);
  if (pick != null && pick < n) { still(pick); cells[pick].scrollIntoView({ block: 'nearest' }); }
}

// Animation player over a list of images with durations (frames at 60 Hz).
function player(target, seq) {
  clearInterval(timer);
  if (!seq.length) return;
  let i = 0, left = seq[0].dur;
  const draw = () => target.replaceChildren(seq[i].canvas);
  draw();
  if (seq.length > 1) timer = setInterval(() => { if (--left > 0) return; i = (i + 1) % seq.length; left = Math.max(1, seq[i].dur); draw(); }, 1000 / 60);
}

// ---------- sprites (CB05) ----------
views.sprites = {
  async init() { items = (index.tCB05 || []).map(([h, n]) => ({ key: h, note: NOTES[h], n: (n / 1024).toFixed(0) + ' KB' })); },
  async show(h) {
    const bytes = await res('tCB05', h), pkg = parsePackage(bytes), base = le(bytes, 0);
    // colors: the package's own palette from the 9B1B pool (what the game uses
    // unless the code showing it picks another), a capture, or the palette menu
    const mode = localStore('sprpal') || 'pool';
    const colors = mode === 'capture' && learnedColors('spr', h) || mode === 'menu' && colorsNow() || await packageColors(bytes);
    const v = $('view');
    v.innerHTML = `<h2>Sprite package ${h}</h2><div class="meta">${NOTES[h] ? NOTES[h] + ' · ' : ''}${pkg.frames.length} frames · ${pkg.anims.length} animations · ${pkg.ntiles} tiles · palette: ${peekLink('/gfx#pool/' + base, 'pool entry ' + base)}</div>
      <div class="controls">Animation <select id="anim"></select> <span id="ainfo" style="color:var(--muted)"></span>
        Colors <select id="sprpal"><option value="pool">in-game (palette pool)</option><option value="capture"${learnedColors('spr', h) ? '' : ' disabled'}>as seen in a capture</option><option value="menu">palette menu</option></select> <span id="tagslot"></span></div>
      <div class="stage" id="stage"></div><div id="framenote"></div><div class="strip" id="strip"></div>
      <h2 style="margin-top:20px">All animations</h2><div class="meta">Every animation playing; click one to open it above.</div><div class="grid" id="anims"></div>`;
    const cache = [], imgAt = i => (cache[i] ??= compose(pkg.parts(pkg.frames[i]), colors));
    const sel = $('anim');
    sel.innerHTML = pkg.anims.map((a, i) => `<option value="${i}">#${i} (id ${a.id}, ${a.keys.length} keys)</option>`).join('') || '<option>none</option>';
    const play = () => {
      const a = pkg.anims[+sel.value]; if (!a) { if (imgAt(0)) $('stage').replaceChildren(toCanvas(imgAt(0), zoom)); return; }
      const fs = a.keys.map(k => pkg.frames[k.frame] ? pkg.parts(pkg.frames[k.frame]) : []);
      const all = fs.flat();
      const box = all.length ? [Math.min(...all.map(p => p.x)), Math.min(...all.map(p => p.y)), Math.max(...all.map(p => p.x + p.w)), Math.max(...all.map(p => p.y + p.h))] : null;
      const seq = a.keys.map((k, i) => { const img = compose(fs[i], colors, box); return { canvas: img ? toCanvas(img, zoom) : document.createElement('span'), dur: k.dur || 8 }; });
      $('ainfo').textContent = a.keys.map(k => `${k.frame}×${k.dur}`).slice(0, 12).join(' ') + (a.keys.length > 12 ? ' …' : '');
      player($('stage'), seq);
    };
    sel.onchange = play; play();
    $('sprpal').value = mode; $('sprpal').onchange = () => { localStore('sprpal', $('sprpal').value); refresh(); };
    frameStrip(pkg.frames.length, imgAt, wantFrame, 'sprframe', h);
    animGrid(pkg, colors, i => { sel.value = i; play(); $('stage').scrollIntoView({ block: 'nearest' }); });
    $('tagslot').appendChild(tagButton('spr', h));
  },
};

// ---------- large sprites (98F5) ----------
views.big = {
  async init() {
    if (!big) { const e = index.t98F5[0][0]; big = parseBig(await res('t98F5', e)); }
    items = big.recs.map((r, i) => ({ key: r.hash, idx: i, note: NOTES[r.hash], n: big.frames(i).length + 'f' }));
  },
  async show(h) {
    // a large sprite's palette is whatever pool entry its OBJ bank held when a
    // capture saw it (unfaded, from 9B1B); else the captured RAM, else the menu
    const L = learned.sprites[`big:${h}`], lp = bigPool[h] ?? L?.pool;
    const variants = [...new Set([L?.pool, ...(L?.pools || []), ...((learned.bigpools || {})[h] || [])].filter(x => x != null))].sort((a, b) => a - b);
    const i = big.recs.findIndex(r => r.hash === h), colors = lp != null ? await packageColors(null, lp) : learnedColors('big', h) || colorsNow();
    const v = $('view');
    if (i < 0) { v.textContent = 'Not found'; return; }
    const r = big.recs[i], frames = big.frames(i);
    v.innerHTML = `<h2>Large sprite ${h}</h2><div class="meta">${NOTES[h] ? NOTES[h] + ' · ' : ''}${frames.length} frames · ${r.w}×${r.h}${learnedNote('big', h)}, centre (${r.cx}, ${r.cy}) · frame order shown, not the game's animation timing</div>
      <div class="controls"><label>Speed <select id="spd"><option value="4">fast</option><option value="8" selected>normal</option><option value="16">slow</option></select></label>${variants.length > 1 ? ` <label>Palette <select id="bigpool">${variants.map(p => `<option value="${p}"${p === lp ? ' selected' : ''}>pool ${p}</option>`).join('')}</select></label>` : ''} <span id="tagslot"></span></div>

      else { const id = $('tsel').value; localStore('mapts.' + mh, id); tileAt = tilesetOffsets(id) || (() => null); }
      // the scene names its BG palette (proc_888); captures and the palette menu override it
      const scenePal = !capColors && !palPicked && palettes.find(p => p.hash === scenes.find(x => x.scene === +$('scn')?.value)?.palette);
      const cols = capColors || (scenePal ? palColors(scenePal) : colorsNow());
      let img, cells;
      if (li < 0) {  // composite: back layers first
        const W = Math.max(...m.ents.map(e => e.w)), H = Math.max(...m.ents.map(e => e.h));
        img = new ImageData(W * 16, H * 16);
        const [R0, G0, B0] = cols[0];
        for (let k = 0; k < img.data.length; k += 4) { img.data[k] = R0; img.data[k + 1] = G0; img.data[k + 2] = B0; img.data[k + 3] = 255; }
        for (let k = m.ents.length - 1; k >= 0; k--) ({ cells } = renderMP(m, m.ents[k], tileAt, cols, $('grid').checked && k === 0, img));
      } else ({ img, cells } = renderMP(m, ent, tileAt, cols, $('grid').checked));
      const cv = toCanvas(img, zoom), wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;display:inline-block';
      svg = svgEl('svg', { viewBox: `0 0 ${cv.width} ${cv.height}`, width: cv.width * zoom, height: cv.height * zoom, style: 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none' });
      wrap.append(cv, svg); $('ms').replaceChildren(wrap);
      overlay();
      cv.onmousemove = ev => {
        const r = cv.getBoundingClientRect(), x = Math.floor((ev.clientX - r.left) / zoom / 16), y = Math.floor((ev.clientY - r.top) / zoom / 16);
        if (x >= 0 && y >= 0 && x < ent.w && y < ent.h) $('hover').textContent = `metatile (${x}, ${y}) = #${cells[y * ent.w + x]}`;
      };
    };
    ['lay', 'tsel', 'grid'].forEach(id => $(id) && ($(id).onchange = draw));
    ['ovobj', 'ovter'].forEach(id => $(id) && ($(id).onchange = overlay));
    if ($('scn')) $('scn').onchange = draw;
    draw();
  },
};

// ---------- palettes ----------
// ---------- sprite palette pool (9B1B) ----------
views.pool = {
  free: true,  // any entry number, not just the listed pages
  async init() {
    const pool = await spritePool();
    // which packages start where
    const users = {};
    await Promise.all((index.tCB05 || []).map(async ([h]) => { const b = await res('tCB05', h); (users[le(b, 0)] ||= []).push(h); }));
    this.users = users;
    items = Array.from({ length: Math.ceil(pool.n / 32) }, (_, k) => ({ key: String(k * 32), note: `entries ${k * 32}–${Math.min(pool.n, k * 32 + 32) - 1}`, n: Object.keys(users).filter(u => u >= k * 32 && u < k * 32 + 32).length + ' pkg' }));
  },
  async show(key) {
    const pool = await spritePool(), want = +key, start = Math.floor(want / 32) * 32, v = $('view');
    v.innerHTML = `<h2>Sprite palette pool</h2><div class="meta">Resource 9B1B: ${pool.n} sub-palettes of 16 colors. The game copies entries into OBJ palette banks as sprites need them; a sprite package's first word is the entry its palette bank 0 uses. Showing ${start}–${Math.min(pool.n, start + 32) - 1}.</div><div class="palgrid" id="pg"></div>`;
    for (let i = start; i < Math.min(pool.n, start + 32); i++) {
      const card = document.createElement('div'); card.className = 'palcard' + (i === want ? ' on' : '');
      const us = this.users[i] || [];
      card.innerHTML = `<code>#${i}</code> ${us.map(h => `<a href="#sprites/${h}">${h}</a>${NOTES[h] ? ' ' + esc(NOTES[h]) : ''}`).join(', ')}<div class="pal" style="grid-template-columns:repeat(16,14px)">${pool.entry(i).map(([r, g, b]) => `<i style="background:rgb(${r},${g},${b})"></i>`).join('')}</div>`;
      if (i === want) setTimeout(() => card.scrollIntoView({ block: 'center' }), 0);
      $('pg').appendChild(card);
    }
  },
};

// ---------- data: resources that are not graphics ----------
views.data = {
  free: true,
  async init() { items = Object.entries(index).flatMap(([lab, es]) => es.map(([h, n]) => ({ key: `${lab}:${h}`, note: lab, n: n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B' }))); },
  async show(key) {
    const [lab, h] = key.split(':');
    let d = await res(lab, h);
    const packed = d[0] === 0x10 && d.length > 4;
    if (packed) { try { d = lz77(d); } catch (e) { /* not LZ77 after all */ } }
    const v = $('view'), PAGE = 4096;
    let off = 0;
    v.innerHTML = `<h2>${esc(lab)} ${esc(h)}</h2><div class="meta">${esc(RES_TYPES[lab] || 'not decoded yet')} · ${d.length.toLocaleString()} bytes${packed ? ' (LZ77-decompressed)' : ''} · <a href="#tiles/${key}">view as tiles</a></div>
      <div class="controls"><button id="prev">◀</button> <span id="where"></span> <button id="next">▶</button></div><pre id="hex" style="font:12px/1.5 ui-monospace,Menlo,monospace;margin:0"></pre>`;
    const draw = () => {
      const rows = [];
      for (let o = off; o < Math.min(d.length, off + PAGE); o += 16) {
        const bs = [...d.slice(o, o + 16)];
        rows.push(`${o.toString(16).padStart(6, '0')}  ${bs.map(x => x.toString(16).padStart(2, '0')).join(' ').padEnd(48)}  ${bs.map(x => x >= 32 && x < 127 ? String.fromCharCode(x) : '·').join('')}`);
      }
      $('hex').textContent = rows.join('\n');
      $('where').textContent = `${off.toString(16)}–${Math.min(d.length, off + PAGE).toString(16)} of ${d.length.toString(16)}`;
    };
    $('prev').onclick = () => { off = Math.max(0, off - PAGE); draw(); };
    $('next').onclick = () => { if (off + PAGE < d.length) off += PAGE; draw(); };
    draw();
  },
};

views.palettes = {
  async init() { items = palettes.map((p, i) => ({ key: p.hash, i })); },
  async show(h) {
    const v = $('view');
    v.innerHTML = `<h2>Palettes</h2><div class="meta">${palettes.length} resources of 256 colors (16 banks). Sprites choose a bank per part; which palette the game loads for a sprite is set at runtime (scripts, stage data), so pick one here. Click a palette to use it everywhere.</div><div class="palgrid" id="pg"></div>`;
    const pg = $('pg');
    palettes.forEach((p, i) => {
      const card = document.createElement('div'); card.className = 'palcard' + (curPal === p ? ' on' : '');
      const cols = palColors(p);
      card.innerHTML = `<code>${p.hash}</code><div class="pal">${cols.map(([r, g, b]) => `<i style="background:rgb(${r},${g},${b})"></i>`).join('')}</div>`;
      card.onclick = () => { $('palSel').value = i; curPal = p; localStore('pal', i); pg.querySelectorAll('.palcard').forEach(x => x.classList.toggle('on', x === card)); };
      if (p.hash === h) setTimeout(() => card.scrollIntoView({ block: 'center' }), 0);
      pg.appendChild(card);
    });
  },
};

// ---------- font ----------
views.font = {
  async init() {
    if (!font) {
      font = await fetch('/api/font').then(r => r.arrayBuffer()).then(b => new Uint8Array(b));
      charmap = await fetch('/api/charmap').then(r => r.json());
    }
    items = [{ key: 'ASCII', note: '128 half-width glyphs' }, ...[0, 1, 2, 3, 4, 5].map(p => ({ key: 'PAGE' + p, note: `glyphs ${p}00–${p}FF` + (p === 0 ? ' (kana, symbols)' : '') }))];
  },
  async show(k) {
    const v = $('view'), z = Math.max(2, zoom);
    const ink = [[0, 0, 0], [140, 58, 46], [194, 122, 98], [228, 185, 163]];
    const colors = Array.from({ length: 256 }, (_, i) => ink[i & 15] || [255, 247, 223]);
    let n, w, off, base = 0;
    if (k === 'ASCII') { n = 128; w = 8; off = g => 0xC + g * 64; }
    else { base = +k.slice(4) * 256; n = Math.min(256, 1537 - base); w = 16; off = g => 0x200C + (base + g) * 128; }
    const cols = 16, cell = w + 4, img = new ImageData(cols * cell, Math.ceil(n / cols) * 20);
    for (let g = 0; g < n; g++) {
      const x = (g % cols) * cell + 2, y = Math.floor(g / cols) * 20 + 2, o = off(g);
      if (w === 8) { tile(img, font, o, x, y, colors, 0); tile(img, font, o + 32, x, y + 8, colors, 0); }
      else [[0, 0], [8, 0], [0, 8], [8, 8]].forEach(([dx, dy], t) => tile(img, font, o + t * 32, x + dx, y + dy, colors, 0));
    }
    v.innerHTML = `<h2>Font · ${k === 'ASCII' ? 'ASCII (0x20–0x9F)' : 'glyphs ' + base.toString(16).toUpperCase().padStart(3, '0') + '–' + (base + n - 1).toString(16).toUpperCase().padStart(3, '0')}</h2>
      <div class="meta">Hover a glyph for its code and reading from data/charmap.tsv. Text uses code 0x8000 + glyph.</div>
      <div class="legend"><span><b style="background:#2f7d4f"></b>mapped in charmap.tsv</span><span><b style="background:#888"></b>unmapped (blank glyph)</span></div>
      <div class="stage" id="fs" style="background:#fff7df"></div>`;
    const cv = toCanvas(img, z); $('fs').appendChild(cv);
    // Confidence marks under each glyph.
    const ctx = cv.getContext('2d');
    if (k !== 'ASCII') for (let g = 0; g < n; g++) {
      const e = charmap[(base + g).toString(16).toUpperCase().padStart(4, '0')];
      ctx.fillStyle = !e ? '#888' : '#2f7d4f';
      ctx.fillRect((g % cols) * cell + 2, Math.floor(g / cols) * 20 + 18, w, 1);
    }
    cv.onmousemove = ev => {
      const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / z, y = (ev.clientY - r.top) / z;
      const g = Math.floor(y / 20) * cols + Math.floor(x / cell);
      if (g < 0 || g >= n) return tipHide();
      const code = k === 'ASCII' ? g + 0x20 : base + g;
      const ch = k === 'ASCII' ? String.fromCharCode(code) : (charmap[code.toString(16).toUpperCase().padStart(4, '0')] ?? '—');
      tipShow(ev, k === 'ASCII' ? `byte 0x${code.toString(16).toUpperCase()} · ${ch}` : `glyph ${code.toString(16).toUpperCase().padStart(3, '0')} · text code ${(0x8000 + code).toString(16).toUpperCase()} · <b style="font-size:18px">${ch}</b>`);
    };
    cv.onmouseleave = tipHide;
  },
};
function tipShow(ev, html) { const t = $('tip'); t.innerHTML = html; t.style.display = 'block'; t.style.left = ev.clientX + 14 + 'px'; t.style.top = ev.clientY + 14 + 'px'; }
function tipHide() { $('tip').style.display = 'none'; }

// ---------- raw tiles ----------
views.tiles = {
  async init() {
    items = Object.entries(index).flatMap(([lab, es]) => es.map(([h, n]) => ({ key: `${lab}:${h}`, n: n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B' })));
  },
  async show(key) {
    const [lab, h] = key.split(':'), d = await res(lab, h), v = $('view');
    const st = JSON.parse(localStore('tiles') || '{"w":16,"off":0,"bank":0}');
    v.innerHTML = `<h2>Raw tiles · ${lab} ${h}</h2><div class="meta">${d.length.toLocaleString()} bytes shown as 4bpp 8×8 tiles, for exploring formats not decoded yet.</div>
      <div class="controls">Width <input id="tw" type="number" min="1" max="64" value="${st.w}" style="width:4em"> tiles · Offset <input id="to" type="number" min="0" step="32" value="${st.off}" style="width:7em"> bytes · Bank <input id="tb" type="number" min="0" max="15" value="${st.bank}" style="width:3.5em"> · showing at most 1024 tiles</div>
      <div class="stage" id="ts"></div>`;
    const draw = () => {
      const w = +$('tw').value || 16, off = Math.max(0, +$('to').value || 0), bank = +$('tb').value || 0;
      localStore('tiles', JSON.stringify({ w, off, bank }));
      const n = Math.min(1024, Math.floor((d.length - off) / 32)), rows = Math.ceil(n / w);
      if (n <= 0) { $('ts').textContent = 'Offset past the end.'; return; }
      const img = new ImageData(w * 8, rows * 8), colors = colorsNow();
      for (let t = 0; t < n; t++) tile(img, d, off + t * 32, (t % w) * 8, Math.floor(t / w) * 8, colors, bank);
      $('ts').replaceChildren(toCanvas(img, zoom));
    };
    ['tw', 'to', 'tb'].forEach(id => $(id).oninput = draw);
    draw();
  },
};

boot();
</script>
