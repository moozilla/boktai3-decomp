<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boktai 3 Actors</title>
<link rel="stylesheet" href="/static/common.css">
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #2b2620; --muted: #7d7468; --line: #e3dccf;
  --accent: #b5462f; --accent-ink: #fff; --sel: #f3e3d6; --ok: #2f7d4f; --stage: #3b3f55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dc; --muted: #9a9083; --line: #3a352e;
    --accent: #e0745a; --accent-ink: #1b1916; --sel: #3a2c25; --ok: #6cc596;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
button, input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#side .tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.count, .chk { color: var(--muted); font-size: 12px; }
#list { overflow-y: auto; flex: 1; }
.row { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--sel); }
.row.on { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
.row b { font-weight: 500; }
.row code { font-size: 12px; color: var(--muted); margin-right: 6px; }
.row small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.special { font-weight: 500; color: var(--accent); }
#view { overflow: auto; padding: 14px 20px 40px; min-width: 0; }
#view.frame { padding: 0; overflow: hidden; }
#view iframe.obj { display: block; width: 100%; height: 100%; border: 0; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.meta { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }
code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.sprites { display: flex; gap: 10px; flex-wrap: wrap; }
.spr { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 90px; text-decoration: none; color: var(--ink); }
.spr .pic { min-height: 64px; display: flex; align-items: center; image-rendering: pixelated; }
.spr .pic canvas { image-rendering: pixelated; }
.spr small { color: var(--muted); font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); white-space: nowrap; }
.chip a { text-decoration: none; }
table { border-collapse: collapse; font-size: 13px; }
td, th { padding: 3px 10px 3px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.cand { color: var(--muted); font-size: 12px; }
.conf { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
.conf-high { border-color: var(--ok, #2f7d4f); color: var(--ok, #2f7d4f); }
.commands { margin: 10px 0; width: 100%; max-width: 760px; table-layout: fixed; }
.commands th:first-child { width: 46px; }
.commands th:last-child { width: 104px; }
.commands td:first-child { font-variant-numeric: tabular-nums; }
.commands td:nth-child(2) { overflow-wrap: anywhere; }
body.embed #side { display: none; }
body.embed main { grid-template-columns: 1fr; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #side { height: 40vh; } }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="side">
    <div class="tools">
      <input id="q" type="search" placeholder="Filter: key, label, name, function, sprite" autocomplete="off">
      <label class="chk"><input type="checkbox" id="fgcl"> with a GCL name</label>
      <label class="chk"><input type="checkbox" id="fspr"> with a sprite</label>
      <label class="chk"><input type="checkbox" id="fused"> created by a script</label>
      <div class="count" id="count"></div>
    </div>
    <div id="list"></div>
  </section>
  <section id="view"><div class="empty">Loading…</div></section>
</main>
<script src="/static/common.js"></script>
<script>
// The script actor registry (data/actor_registry.csv): every object a script
// can create by key with `chara KEY NAME` or call with `command KEY`. Recovered
// GCL names come from gcl/names/chara.csv; cross-references from
// tools/assets/actors.py.
studioHeader();
let A = [], byKey = {}, enemies = [], characters = [], scenes = {}, en = {}, commandTables = {}, numericTables = {}, playerAnimations = null, sel = null;

const label = a => noteOf('actor', a.key)?.label;
const gclTitle = a => a.gcl.length ? a.gcl[0].name + (a.gcl[0].english ? ` (${a.gcl[0].english})` : '') : '';
const title = a => label(a) || gclTitle(a) || (a.names.length ? a.names.map(n => n.jp).join(' / ') + '?' : a.callback_name);

function renderList() {
  const q = $('q').value.trim().toUpperCase(), fs = $('fspr').checked, fu = $('fused').checked, fg = $('fgcl').checked;
  const hits = A.filter(a => (!fs || a.sprites.length) && (!fu || a.procs.length) && (!fg || a.gcl.length) &&
    (!q || [a.key, label(a), a.callback_name, a.loader_name, ...a.sprites.map(s => s.hash), ...a.names.map(n => n.jp + ' ' + (en[n.id] || '')), ...a.gcl.map(g => g.name + ' ' + g.english)].some(x => (x || '').toUpperCase().includes(q))));
  $('count').textContent = `${hits.length} of ${A.length} registry entries`;
  const special = (key, text) => {
    const d = document.createElement('div');
    d.className = 'row special' + (sel?.split(':')[0] === key ? ' on' : ''); d.dataset.key = key;
    d.textContent = text; d.onclick = () => { location.hash = key; };
    return d;
  };
  $('list').replaceChildren(special('names', 'Name lists from the game (monsters, characters)'),
    special('commands', `Command tables (${Object.keys(commandTables).length} decoded)`),
    special('tables', `Numeric tables (${Object.keys(numericTables).length} decoded)`),
    ...(playerAnimations ? [special('player-animations', 'Player animation variants (4 modes)')] : []), ...hits.map(a => {
    const d = document.createElement('div'); d.className = 'row' + (a.key === sel ? ' on' : ''); d.dataset.key = a.key;
    d.innerHTML = `<code>${a.key}</code><b></b><small></small>`;
    d.querySelector('b').textContent = title(a);
    d.querySelector('small').textContent = [a.callback_name !== title(a) && a.callback_name, a.sprites.length && 'sprite ' + a.sprites.map(s => s.hash).join(','),
      a.procs.length && `${a.procs.length} proc${a.procs.length > 1 ? 's' : ''}`, a.scenes.length && `${a.scenes.length} scenes`].filter(Boolean).join(' · ');
    d.onclick = () => { location.hash = a.key; };
    return d;
  }));
}

async function show(key) {
  sel = key;
  $('view').classList.remove('frame');
  const navKey = key.startsWith('commands:') ? 'commands' : key.startsWith('tables:') ? 'tables' : key;
  document.querySelectorAll('.row').forEach(d => d.classList.toggle('on', d.dataset.key === navKey));
  document.querySelector('.row.on')?.scrollIntoView({ block: 'nearest' });
  if (key === 'names') return showNames();
  if (navKey === 'commands') return showCommandTables(key.split(':')[1]);
  if (key === 'player-animations') return showPlayerAnimations();
  if (navKey === 'tables') return showNumericTables(...key.split(':').slice(1));
  const a = byKey[key], v = $('view');
  if (!a) { v.innerHTML = `<div class="empty">No registry entry ${esc(key)}.</div>`; return; }
  // one page per object, Browse's (tools/studio/atlas.html), shown here beside the registry list
  v.classList.add('frame');
  const f = v.querySelector('iframe.obj');
  if (f) f.contentWindow.location.hash = 'actor:' + a.key;
  else v.innerHTML = `<iframe class="obj" src="/atlas?embed=1&bare=1#actor:${a.key}" title="${esc(title(a))}"></iframe>`;
}

function showCommandTables(addr) {
  const tables = addr ? [commandTables[addr]].filter(Boolean) : Object.values(commandTables);
  if (!tables.length) {
    $('view').innerHTML = `<h2>Actor script command tables</h2><div class="empty">${addr ? `No decoded table at ${esc(addr)}.` : 'No tables decoded yet.'}</div>`;
    return;
  }
  $('view').innerHTML = `<h2>Actor script command tables</h2>
    <p class="meta">A command packet selects a handler by its numeric index. ${codeLink('08136F1C', 'SceneActorScript_OnCommand')} reads the table from the actor and passes the actor and packet to the selected handler. These indices are separate from GCL registry keys.</p>
    ${addr ? '<p><a href="#commands">All decoded command tables</a></p>' : ''}
    ${tables.map(t => {
      const users = A.filter(a => (a.command_tables || []).some(r => r.table === t.addr));
      return `<section><h3><a href="#commands:${t.addr}">${esc(t.description || t.name)}</a></h3>
        <div class="meta"><span class="mono">${t.addr}–${t.end}</span> · ${t.size} bytes · <code>${esc(t.source)}</code></div>
        <table class="commands"><thead><tr><th>Index</th><th>Handler</th><th>Thumb pointer</th></tr></thead><tbody>
          ${t.entries.map(e => `<tr><td>${e.index}</td><td>${e.addr ? codeLink(e.addr, e.name) : '<span class="empty">Empty slot</span>'}</td><td class="mono">${e.callback}</td></tr>`).join('')}
        </tbody></table>
        <div class="meta">${users.length ? 'Referenced by registry entries: ' + users.map(a => `<a href="#${a.key}" title="${esc(a.callback_name)}">${a.key}</a>`).join(', ') : 'No direct reference found in the registry callbacks or their loaders.'}</div>
      </section>`;
    }).join('')}
    <p class="meta">Rows keep the dispatch order. Handler names follow the current code symbols; pointer values retain the Thumb bit.</p>`;
}

function showPlayerAnimations() {
  const data = playerAnimations;
  if (!data) {
    $('view').innerHTML = '<h2>Player animation variants</h2><div class="empty">No decoded tables.</div>';
    return;
  }
  const hex = value => value.toString(16).toUpperCase().padStart(4, '0');
  $('view').innerHTML = `<h2>Player animation variants</h2>
    <p class="meta">${codeLink(data.lookup.addr, data.lookup.name)} selects one of four tables by action mode and reads its numeric index.
      ${codeLink(data.select.addr, data.select.name)} adds the folded heading to that base sequence before selecting keyframes.</p>
    <div class="meta"><span class="mono">${data.addr}–${data.end}</span> · ${data.size} bytes · <code>${esc(data.source)}</code></div>
    <table class="commands"><thead><tr><th>Index</th>${data.tables.map(t => `<th>Mode ${t.mode}<br><span class="mono">${t.addr}</span></th>`).join('')}</tr></thead><tbody>
      ${data.tables[0].entries.map((entry, index) => `<tr><td>${entry.index}</td>${data.tables.map(t => {
        const value = t.entries[index].base_sequence;
        return `<td class="mono${value === 0xFFFF ? ' meta' : ''}">${hex(value)}</td>`;
      }).join('')}</tr>`).join('')}
    </tbody></table>
    <p class="meta">Base sequences are hexadecimal. FFFF values retain their stored value. Rows keep the game's index order; editing the CSV changes the normal data build.</p>
    <h3>Direct player cue callers (${data.consumers.length})</h3>
    <div class="chips">${data.consumers.map(f => `<span class="chip">${codeLink(f.addr, f.name)}</span>`).join('')}</div>
    <p class="meta">Calls to the table lookup in the player cue code, read from ROM disassembly. Function names follow the current code symbols.</p>`;
}

function showNumericTables(addr, offset) {
  const tables = addr ? [numericTables[addr]].filter(Boolean) : Object.values(numericTables);
  $('view').innerHTML = `<h2>Numeric tables</h2>
    ${addr ? '<p><a href="#tables">All numeric tables</a></p>' : ''}
    ${tables.length ? tables.map(t => {
      const perPage = 64;
      const first = addr ? Math.min(Math.max(0, Math.floor((Number(offset) || 0) / perPage)), Math.floor((t.entries.length - 1) / perPage)) * perPage : 0;
      const rows = t.entries.slice(first, first + perPage);
      const page = (n, label) => `<a href="#tables:${t.addr}:${n}">${label}</a>`;
      return `<section>
      <h3><a href="#tables:${t.addr}">${esc(t.description || t.name)}</a></h3>
      <div class="meta"><span class="mono">${t.addr}–${t.end}</span> · ${t.size} bytes · <code>${esc(t.source)}</code></div>
      <p>${esc(t.meaning)}</p>
      <table><thead><tr>${t.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(e => `<tr>${t.columns.map(c => `<td>${esc(String(e[c]))}</td>`).join('')}</tr>`).join('')}
      </tbody></table>
      ${t.entries.length > perPage ? `<p>Rows ${first + 1}–${first + rows.length} of ${t.entries.length} · ${first ? page(first - perPage, 'Previous') : ''} ${first + perPage < t.entries.length ? page(first + perPage, 'Next') : ''}</p>` : ''}
      <p class="meta">Consumers include ${t.consumers.map(f => codeLink(f.addr, f.name)).join(', ')}.</p>
    </section>`; }).join('') : '<div class="empty">No decoded numeric table at this address.</div>'}
    <p class="meta">Edit the CSV sources to change these parameters. Keep rows in their original index order. Each table has a fixed size.</p>`;
}

function showNames() {
  const linked = {};
  for (const a of A) for (const n of a.names) (linked[n.id] ||= []).push(a);
  const row = n => `<tr><td>${stringLink(n.id)}</td><td>${esc(n.jp)}</td><td class="cand">${esc(en[n.id] || '')}</td><td>${(linked[n.id] || []).map(a => `<a href="#${a.key}">${a.key}</a> <span class="cand">via ${a.names.find(x => x.id === n.id).via}</span>`).join(', ')}</td></tr>`;
  $('view').innerHTML = `<h2>Name lists from the game</h2>
    <div class="meta">Text-bank strings (click an ID to open it in the text editor). English in grey is the fan translation, for reading only.</div>
    <h3>Monsters (strings ${enemies[0]?.id}–${enemies.at(-1)?.id})</h3>
    <p class="meta">The game shows these as base + index somewhere (a bestiary-like set: descriptions follow at 2509, elements at 9927, classes at 9936), but the code or script that adds 9838 to an enemy kind is not found yet: code reaches strings as a script-supplied base plus an offset, no script operand supplies a base near 9838, and the late-game save's pause menus never look one up. Links below go through the family's sprite (visual identification), so they are candidates.</p>
    <table><tr><th>String</th><th>Name</th><th></th><th>Registry entries</th></tr>${enemies.map(row).join('')}</table>
    <h3>Characters (strings ${characters[0]?.id}–${characters.at(-1)?.id})</h3>
    <table><tr><th>String</th><th>Name</th><th></th><th></th></tr>${characters.map(row).join('')}</table>`;
}

$('q').oninput = renderList; $('fspr').onchange = renderList; $('fused').onchange = renderList; $('fgcl').onchange = renderList;
listKeys(() => $('list'), '.row');
const routeKey = hash => hash.toLowerCase() === 'names' ? 'names' : hash.toLowerCase() === 'player-animations' ? 'player-animations' : /^commands(?::|$)/i.test(hash) ? 'commands' + hash.slice(8).toUpperCase() : /^tables(?::|$)/i.test(hash) ? 'tables' + hash.slice(6).toUpperCase() : hash.toUpperCase();
window.onhashchange = () => { const k = routeKey(location.hash.slice(1)); if (k && k !== sel) show(k); };
(async () => {
  await loadNotes();
  const [d, e] = await Promise.all([fetch('/api/actors').then(r => r.json()), fetch('/api/english').then(r => r.json()).catch(() => ({}))]);
  A = d.actors; enemies = d.enemies; characters = d.characters; scenes = d.scenes; en = e; commandTables = d.command_tables || {}; numericTables = d.numeric_tables || {}; playerAnimations = d.player_animations || null;
  byKey = Object.fromEntries(A.map(a => [a.key, a]));
  renderList();
  const k = routeKey(location.hash.slice(1)) || A.find(a => a.loader && a.sprites.length)?.key;
  if (k) { if (!location.hash) history.replaceState(null, '', '#' + k); show(k); }
})();
</script>
</body>
</html>
